<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Patological — Adivinhe a doença do dia</title>
<meta name="description" content="Jogo diário: adivinhe a doença veterinária de hoje comparando espécie, sistema, letalidade e outros parâmetros clínicos a cada palpite.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');

:root{
  --cor-fundo-1:#E4F4FF;
  --cor-fundo-2:#DCEBFF;
  --cor-primaria:#4E7CFF;
  --cor-primaria-escura:#3557CC;
  --cor-secundaria:#4ECDC4;
  --cor-secundaria-escura:#33A79F;
  --cor-acento:#C77DFF;
  --cor-sucesso:#2FBF71;
  --cor-alerta:#FFB800;
  --cor-texto:#25324B;
  --cor-texto-suave:#5b6a85;
  --cor-card:#FFFFFF;
  --cor-card-borda:#25324B;
  --raio:22px;
  --raio-pequeno:14px;
  --sombra-sticker:0 6px 0 rgba(37,50,75,0.18), 0 10px 20px rgba(37,50,75,0.12);
  --sombra-sticker-pequena:0 4px 0 rgba(37,50,75,0.18), 0 6px 14px rgba(37,50,75,0.10);
  --fonte: 'Baloo 2', 'Comic Sans MS', 'Segoe UI Rounded', 'Trebuchet MS', Verdana, sans-serif;
  --cor-verde:#2FBF71; --cor-verde-bg:#E9FBF2;
  --cor-amarelo:#C99A00; --cor-amarelo-bg:#FFF6D9;
  --cor-laranja:#D9682D; --cor-laranja-bg:#FFE7D6;
  --cor-vermelho:#D9455F; --cor-vermelho-bg:#FFE7EC;
  color-scheme: light;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; min-height:100%;
  font-family: var(--fonte); color: var(--cor-texto);
  background: radial-gradient(circle at 15% 10%, var(--cor-fundo-2), transparent 55%),
              radial-gradient(circle at 85% 90%, var(--cor-secundaria), transparent 40%),
              linear-gradient(160deg, var(--cor-fundo-1), var(--cor-fundo-2));
  background-attachment: fixed;
  overflow-x:hidden;
}
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
#app{ max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; }

.marca{ display:flex; align-items:center; justify-content:center; gap:10px; margin: 4px 0 18px; }
.marca h1{ font-size: clamp(26px, 6vw, 38px); margin:0; letter-spacing: 0.5px; color: var(--cor-primaria-escura);
  text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff; }
.marca .mascote{ width:60px; height:52px; flex-shrink:0; }

.card{ background: var(--cor-card); border: 3px solid var(--cor-card-borda); border-radius: var(--raio);
  box-shadow: var(--sombra-sticker); padding: 22px; margin-bottom: 18px; }
.card h2{ margin-top:0; }

.btn{ font-family: inherit; font-size: 17px; font-weight: 700; color: #fff; background: var(--cor-primaria);
  border: 3px solid var(--cor-card-borda); border-radius: 999px; padding: 14px 26px; min-height: 48px; min-width: 44px;
  cursor: pointer; box-shadow: var(--sombra-sticker-pequena); transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
  touch-action: manipulation; }
.btn:hover{ filter: brightness(1.05); }
.btn:active{ transform: translateY(3px) scale(0.97); box-shadow: 0 1px 0 rgba(37,50,75,0.18); }
.btn:focus-visible{ outline: 3px solid var(--cor-acento); outline-offset: 3px; }
.btn.secundario{ background: var(--cor-secundaria); }
.btn.acento{ background: var(--cor-acento); }
.btn.fantasma{ background: #fff; color: var(--cor-texto); }
.btn:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }
.btn-pequeno{ font-size:14px; padding:8px 16px; min-height:36px; }

.campo{ width:100%; font-family:inherit; font-size:16px; border:2px solid #ccc; border-radius: var(--raio-pequeno);
  padding:12px 14px; margin-bottom:12px; min-height:44px; }
.campo:focus{ outline:3px solid var(--cor-acento); outline-offset:1px; border-color: var(--cor-acento); }
.rotulo-campo{ display:block; font-weight:700; margin-bottom:6px; }
.faixa-sessao{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff;
  border:3px solid var(--cor-card-borda); border-radius: var(--raio-pequeno); padding:10px 16px; margin-bottom:16px; flex-wrap:wrap; }
.faixa-sessao strong{ color: var(--cor-primaria-escura); }
.aviso-config{ background:#FFF3CD; border:2px dashed #B08900; color:#6b5400; border-radius: var(--raio-pequeno); padding:12px 16px; font-size:14px; }
.campo-erro{ color:#B00020; font-size:14px; white-space:pre-wrap; }
.ajuda-campo{ font-size:12px; color: var(--cor-texto-suave); margin:4px 0 0; }
.rodape-nota{ text-align:center; font-size:12px; color: var(--cor-texto-suave); margin-top:24px; }

/* --------- Formulário de palpite --------- */
.linha-palpite-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
.linha-palpite-form .campo{ flex:1; min-width:200px; margin-bottom:0; }
.contador-tentativas{ font-size:14px; color: var(--cor-texto-suave); margin:0 0 10px; }

/* --------- Cartão de um palpite (linha do histórico) --------- */
.cartao-palpite{ border:3px solid var(--cor-card-borda); border-radius: var(--raio-pequeno);
  background:#fff; padding:14px 16px; margin-bottom:12px; box-shadow: var(--sombra-sticker-pequena); }
.cartao-palpite.acertou{ border-color: var(--cor-sucesso); background:#F2FFF8; }
.cartao-palpite h3{ margin:0 0 10px; font-size:17px; display:flex; align-items:center; gap:8px; }
.numero-palpite{ display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px;
  border-radius:50%; background: var(--cor-texto); color:#fff; font-size:13px; font-weight:800; flex-shrink:0; }
.grade-atributos{ display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; }
@media (min-width:460px){ .grade-atributos{ grid-template-columns: repeat(3, 1fr); } }
@media (min-width:620px){ .grade-atributos{ grid-template-columns: repeat(4, 1fr); } }
.celula-atributo{ border-radius:12px; padding:8px 6px; text-align:center; border:2px solid transparent; min-width:0; overflow-wrap:normal; word-break:normal; }
.celula-atributo .rotulo-atributo{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.3px; opacity:0.75; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.celula-atributo .valor-atributo{ font-size:12.5px; font-weight:800; line-height:1.3; hyphens:none; }
.celula-atributo.cor-verde{ background: var(--cor-verde-bg); color: var(--cor-verde); border-color: var(--cor-verde); }
.celula-atributo.cor-amarelo{ background: var(--cor-amarelo-bg); color: var(--cor-amarelo); border-color: var(--cor-amarelo); }
.celula-atributo.cor-laranja{ background: var(--cor-laranja-bg); color: var(--cor-laranja); border-color: var(--cor-laranja); }
.celula-atributo.cor-vermelho{ background: var(--cor-vermelho-bg); color: var(--cor-vermelho); border-color: var(--cor-vermelho); }

/* --------- Legenda --------- */
.legenda{ display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color: var(--cor-texto-suave); margin-top:2px; }
.legenda .item-legenda{ display:flex; align-items:center; gap:5px; }
.ponto-legenda{ width:12px; height:12px; border-radius:4px; display:inline-block; border:2px solid; }
.ponto-legenda.cor-verde{ background: var(--cor-verde-bg); border-color: var(--cor-verde); }
.ponto-legenda.cor-amarelo{ background: var(--cor-amarelo-bg); border-color: var(--cor-amarelo); }
.ponto-legenda.cor-laranja{ background: var(--cor-laranja-bg); border-color: var(--cor-laranja); }
.ponto-legenda.cor-vermelho{ background: var(--cor-vermelho-bg); border-color: var(--cor-vermelho); }

/* --------- Arquivo (dias anteriores) --------- */
.linha-arquivo{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 0; border-bottom:2px dashed #dde6f5; flex-wrap:wrap; }
.linha-arquivo:last-child{ border-bottom:none; }
.linha-arquivo-info{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.linha-admin-meta{ font-size:13px; color: var(--cor-texto-suave); }
.btn-pequeno{ font-size:14px; padding:8px 16px; min-height:36px; }

/* --------- Resultado / compartilhar --------- */
.resumo-total{ text-align:center; padding: 18px; }
.resumo-total .numero-grande{ font-size: clamp(40px,10vw,64px); font-weight:800; color: var(--cor-primaria-escura); line-height:1; }
.grade-compartilhar{ display:inline-flex; flex-direction:column; gap:4px; font-size:22px; line-height:1; margin:14px 0; }
.linha-compartilhar{ display:flex; gap:4px; justify-content:center; }
.quadrado-compartilhar{ width:26px; height:26px; border-radius:6px; }

/* --------- Confete --------- */
#confetti-layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999; }
.confete{ position:absolute; top:-20px; width:10px; height:16px; animation-name: cair; animation-timing-function: linear; animation-fill-mode: forwards; border-radius:3px; }
@keyframes cair{ 0%{ transform: translateY(0) rotate(0deg); opacity:1; } 100%{ transform: translateY(110vh) rotate(var(--rot,360deg)); opacity:0.9; } }

@media (max-width:420px){ .card{ padding:16px; } }
</style>
</head>

 *

 * atributos do palpite com os da doença-alvo do dia e mostra o resultado

 * vermelho = diferente) — like Wordle, mas com atributos clínicos em vez
 * de letras. Tentativas ilimitadas; a pontuação é "em quantos palpites
 * você acertou".

/* =========================================================================
 * 3. SEED DETERMINÍSTICO POR DATA (mesma técnica do PatoVetZee, copiada —
 *    arquivos são intencionalmente independentes, sem import entre eles)
 * ======================================================================= */
function hashStringParaSeed(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function criarGeradorPseudoAleatorio(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function embaralharComSeed(array, seedTexto) {
  const rand = criarGeradorPseudoAleatorio(hashStringParaSeed(seedTexto));
  const copia = array.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}
function dataDeHojeYMD() {

/* =========================================================================
 * 4. LÓGICA DE COMPARAÇÃO (o coração do jogo)
 * ======================================================================= */
function compararIgual(a, b) { return a === b ? "verde" : "vermelho"; }

function compararCategorias(catsPalpite, catsAlvo) {
  const setAlvo = new Set(catsAlvo);
  const setPalpite = new Set(catsPalpite);
  const mesmoConjunto = setPalpite.size === setAlvo.size && [...setPalpite].every((c) => setAlvo.has(c));
  if (mesmoConjunto) return "verde";
  const temComum = catsPalpite.some((c) => setAlvo.has(c));
  return temComum ? "amarelo" : "vermelho";
}

// Numérico 0-100: cor por proximidade + seta indicando se o alvo é maior/menor.
function compararNumerico(valorPalpite, valorAlvo) {
  const diff = Math.abs(valorPalpite - valorAlvo);
  let cor;
  if (diff === 0) cor = "verde";
  else if (diff <= 15) cor = "amarelo";
  else if (diff <= 35) cor = "laranja";
  else cor = "vermelho";
  const seta = valorPalpite === valorAlvo ? "" : valorAlvo > valorPalpite ? " ↑" : " ↓";
  return { cor, seta };
}

function avaliarPalpite(palpite, alvo) {
  const letal = compararNumerico(palpite.letalidade, alvo.letalidade);
  const revers = compararNumerico(palpite.reversibilidade, alvo.reversibilidade);
  return {
    especie: { cor: compararIgual(palpite.especie, alvo.especie), texto: palpite.especie },
    sistema: { cor: compararIgual(palpite.sistema, alvo.sistema), texto: CATALOGO_SISTEMAS[palpite.sistema] },
    categorias: { cor: compararCategorias(palpite.categorias, alvo.categorias), texto: palpite.categorias.map((c) => CATALOGO_CATEGORIAS[c]).join(", ") },
    zoonose: { cor: compararIgual(palpite.zoonose, alvo.zoonose), texto: palpite.zoonose ? "Sim" : "Não" },
    contagiosa: { cor: compararIgual(palpite.contagiosa, alvo.contagiosa), texto: palpite.contagiosa ? "Sim" : "Não" },
    letalidade: { cor: letal.cor, texto: palpite.letalidade + letal.seta },
    cura: { cor: compararIgual(palpite.cura, alvo.cura), texto: palpite.cura ? "Sim" : "Não" },
    reversibilidade: { cor: revers.cor, texto: palpite.reversibilidade + revers.seta },
  };
}

  if (attrs) {

      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else if (v !== false && v !== null && v !== undefined) node.setAttribute(k, v);
    }
  }

  return node;
}

      el("div", {}, [
        el("button", { class: "btn secundario", text: "Ver resultado novamente", onclick: () => renderResultadoDeProgresso(progressoHoje) }),
        el("button", { class: "btn fantasma", text: "Jogar de novo (prática, não substitui seu resultado)", onclick: () => iniciarJogoPratica() }),
      ]),
    ]));
  } else {
    partes.push(el("section", { class: "card", style: "text-align:center" }, [
      el("button", { class: "btn", text: "🔎 Começar desafio de hoje", onclick: () => { iniciarJogo({ pratica: false }); renderJogo(); } }),
    ]));
  }

  if (!loginObrigatorio) {
    partes.push(el("section", { class: "card", style: "text-align:center" }, [
      el("button", { class: "btn secundario", text: "🗓️ Jogar dias anteriores", onclick: renderArquivo }),
    ]));
  }

  partes.push(el("section", { class: "card", style: "text-align:center" }, [
    el("button", { class: "btn fantasma", text: "🐾 Voltar pro PatoVetZee", onclick: () => { location.href = "patovetzee.html"; } }),
  ]));
  partes.push(el("p", { class: "rodape-nota", text: "Patological — jogo irmão do PatoVetZee. Mecânica inspirada no Spotle." }));
  partes.forEach((p) => appEl.appendChild(p));
}

/* --------- Arquivo: jogar o desafio de um dia anterior --------- */
function renderArquivo() {
  limparApp();
  appEl.appendChild(renderMarca());

  const datas = listarDatasAnteriores();
  const partes = [el("section", { class: "card" }, [
    el("h2", { text: "🗓️ Dias anteriores" }),
    el("p", { text: "Jogue (ou reveja) o desafio de qualquer dia anterior ao de hoje — mesma mecânica, só muda a doença-alvo." }),
  ])];

  if (datas.length === 0) {
    partes.push(el("section", { class: "card" }, [el("p", { text: "Ainda não tem dia anterior — o jogo começou hoje." })]));
  } else {
    const cardLista = el("section", { class: "card" });
    datas.forEach((data) => {
      const progresso = carregarProgressoLocal(data);
      const jaJogado = progresso && progresso.completed;
      cardLista.appendChild(el("div", { class: "linha-arquivo" }, [
        el("div", { class: "linha-arquivo-info" }, [
          el("strong", { text: `#${numeroRodada(data)} · ${formatarDataExtenso(data)}` }),
          el("div", { class: "linha-admin-meta", text: jaJogado
            ? (progresso.acertou ? `Você acertou em ${progresso.numeroTentativas} palpite${progresso.numeroTentativas === 1 ? "" : "s"}` : `Não acertou (${progresso.numeroTentativas} palpites)`)
            : "Ainda não jogado" }),
        ]),
        el("button", { class: "btn secundario btn-pequeno", text: jaJogado ? "Ver resultado" : "Jogar", onclick: () => {
          if (jaJogado) renderResultadoDeProgresso(progresso, data);
          else { iniciarJogo({ pratica: false, data }); renderJogo(); }
        }}),
      ]));
    });
    partes.push(cardLista);
  }

  partes.push(el("section", { class: "card", style: "text-align:center" }, [
    el("button", { class: "btn fantasma", text: "⬅ Voltar", onclick: renderIntro }),
  ]));
  partes.forEach((p) => appEl.appendChild(p));
}

/* --------- Login / cadastro (idêntico ao PatoVetZee — mesma conta) ------ */
function renderLogin() {
  limparApp();
  appEl.appendChild(renderMarca());
  if (!SUPABASE_CONFIGURADO) {
    appEl.appendChild(el("section", { class: "card" }, [
      el("h2", { text: "Login ainda não configurado" }),
      el("button", { class: "btn secundario", text: "⬅ Voltar", onclick: renderIntro }),
    ]));
    return;
  }
  const campoEmail = document.createElement("input");
  campoEmail.type = "email"; campoEmail.className = "campo"; campoEmail.autocomplete = "email";
  campoEmail.placeholder = "seuemail@exemplo.com";
  const campoSenha = document.createElement("input");
  campoSenha.type = "password"; campoSenha.className = "campo"; campoSenha.autocomplete = "current-password";
  campoSenha.placeholder = "Sua senha (mínimo 6 caracteres)";
  const erroEl = el("p", { class: "campo-erro" });

  const card = el("section", { class: "card" }, [
    el("h2", { text: "Entrar ou criar conta" }),
    el("p", { class: "aviso-config", text: "💡 Já tem conta no PatoVetZee? Use o mesmo e-mail e senha — é a mesma conta." }),
    el("label", { class: "rotulo-campo", text: "E-mail" }), campoEmail,
    el("label", { class: "rotulo-campo", text: "Senha" }), campoSenha,
    erroEl,
  ]);
  card.appendChild(el("div", {}, [
    el("button", { class: "btn", text: "Entrar", onclick: async () => {
      erroEl.style.color = ""; erroEl.textContent = "";
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email: campoEmail.value, password: campoSenha.value });
      if (error) { erroEl.textContent = traduzirErroAuth(error); return; }
      await carregarPerfilDaSessao(data.user);
      if (!sessao.apelido) renderEscolherApelido(); else renderIntro();
    }}),
    el("button", { class: "btn secundario", text: "Criar conta", onclick: async () => {
      erroEl.style.color = ""; erroEl.textContent = "";
      const { data, error } = await supabaseClient.auth.signUp({ email: campoEmail.value, password: campoSenha.value });
      if (error) { erroEl.textContent = traduzirErroAuth(error); return; }
      if (!data.session) { erroEl.style.color = "#1a7a3c"; erroEl.textContent = "Conta criada! Verifique seu e-mail para confirmar antes de entrar."; return; }
      await carregarPerfilDaSessao(data.user);
      renderEscolherApelido();
    }}),
  ]));
  appEl.appendChild(card);
  appEl.appendChild(el("section", { class: "card", style: "text-align:center" }, [el("button", { class: "btn fantasma", text: "⬅ Voltar", onclick: renderIntro })]));
  campoEmail.focus();
}

function renderEscolherApelido() {
  limparApp();
  appEl.appendChild(renderMarca());
  const campo = document.createElement("input");
  campo.type = "text"; campo.className = "campo"; campo.maxLength = 24;
  campo.placeholder = "Ex.: PatoVeterinario99";
  const erroEl = el("p", { class: "campo-erro" });
  appEl.appendChild(el("section", { class: "card" }, [
    el("h2", { text: "Escolha seu apelido" }),
    el("p", { text: "Esse apelido é compartilhado com o PatoVetZee. Pode ser diferente do seu nome real." }),
    campo, erroEl,
    el("button", { class: "btn", text: "Salvar e continuar", onclick: async () => {
      const apelido = campo.value.trim();
      erroEl.textContent = "";
      if (apelido.length < 2 || apelido.length > 24) { erroEl.textContent = "O apelido precisa ter entre 2 e 24 caracteres."; return; }
      const { error } = await supabaseClient.from("perfis").insert({ id: sessao.usuario.id, apelido });
      if (error) {
        erroEl.textContent = /duplicate key|unique/i.test(error.message) ? "Esse apelido já está em uso — escolha outro." : error.message;
        return;
      }
      sessao.apelido = apelido;
      renderIntro();
    }}),
  ]));
  campo.focus();
}

/* =========================================================================
 * 9. JOGO
 * ======================================================================= */
let estado = { desafio: null, alvo: null, tentativas: [], resolvido: false, modoPratica: false };

// `data`: opcional — quando informado, joga o desafio DAQUELE dia (arquivo
// de dias anteriores) em vez do de hoje. Mesmo mecanismo de
// salvar/carregar progresso (indexado por `estado.desafio.data`), então
// um dia antigo já jogado também mostra "você já jogou" se reaberto.
function iniciarJogo({ pratica, data }) {
  const desafio = data ? gerarDesafioDiario(data) : DESAFIO_DO_DIA;
  estado = { desafio, alvo: MAPA_DOENCAS[desafio.doencaAlvoId], tentativas: [], resolvido: false, modoPratica: pratica };
}
function iniciarJogoPratica() {
  const idAleatorio = embaralharComSeed(BANCO_DOENCAS.map((d) => d.id), "pratica|" + Date.now() + "|" + Math.random())[0];
  estado = { desafio: DESAFIO_DO_DIA, alvo: MAPA_DOENCAS[idAleatorio], tentativas: [], resolvido: false, modoPratica: true };
  renderJogo();
}

function construirCartaoPalpite(palpiteId, resultado, numero, acertou) {
  const doenca = MAPA_DOENCAS[palpiteId];
  const grade = el("div", { class: "grade-atributos" }, ORDEM_ATRIBUTOS.map(([chave, rotulo]) =>
    el("div", { class: `celula-atributo cor-${resultado[chave].cor}` }, [
      el("div", { class: "rotulo-atributo", text: rotulo }),
      el("div", { class: "valor-atributo", text: resultado[chave].texto }),
    ])
  ));
  return el("div", { class: "cartao-palpite" + (acertou ? " acertou" : "") }, [
    el("h3", {}, [el("span", { class: "numero-palpite", text: String(numero) }), document.createTextNode(doenca.nome + (acertou ? " 🎉" : ""))]),
    grade,
  ]);
}

function renderLegenda() {
  return el("div", { class: "legenda" }, [
    el("span", { class: "item-legenda" }, [el("span", { class: "ponto-legenda cor-verde" }), document.createTextNode("Igual")]),
    el("span", { class: "item-legenda" }, [el("span", { class: "ponto-legenda cor-amarelo" }), document.createTextNode("Perto/parcial")]),
    el("span", { class: "item-legenda" }, [el("span", { class: "ponto-legenda cor-laranja" }), document.createTextNode("Longe")]),
    el("span", { class: "item-legenda" }, [el("span", { class: "ponto-legenda cor-vermelho" }), document.createTextNode("Diferente")]),
  ]);
}

function renderJogo() {
  limparApp();
  appEl.appendChild(renderMarca());

  const idsJaPalpitados = new Set(estado.tentativas.map((t) => t.doencaId));
  const opcoesDisponiveis = BANCO_DOENCAS.filter((d) => !idsJaPalpitados.has(d.id));

  const cardForm = el("section", { class: "card" }, [
    el("h2", { text: estado.modoPratica ? "Modo prática" : `Desafio #${numeroRodada(estado.desafio.data)} · ${formatarDataExtenso(estado.desafio.data)}` }),
    el("p", { class: "contador-tentativas", text: `${estado.tentativas.length} palpite${estado.tentativas.length === 1 ? "" : "s"} até agora.` }),
  ]);

  const campoPalpite = document.createElement("input");
  campoPalpite.type = "text"; campoPalpite.className = "campo"; campoPalpite.setAttribute("list", "lista-doencas-patological");
  campoPalpite.placeholder = "Nome da doença…"; campoPalpite.autocomplete = "off";
  const datalist = document.createElement("datalist");
  datalist.id = "lista-doencas-patological";
  opcoesDisponiveis.forEach((d) => { const opt = document.createElement("option"); opt.value = d.nome; datalist.appendChild(opt); });

  const erroEl = el("p", { class: "campo-erro" });
  const btnPalpitar = el("button", { class: "btn", text: "Palpitar" });

  function submeterPalpite() {
    erroEl.textContent = "";
    const texto = campoPalpite.value.trim().toLowerCase();
    const doenca = opcoesDisponiveis.find((d) => d.nome.toLowerCase() === texto);
    if (!doenca) { erroEl.textContent = "Escolha uma doença válida da lista (ainda não palpitada)."; return; }
    const resultado = avaliarPalpite(doenca, estado.alvo);
    const acertou = doenca.id === estado.alvo.id;
    estado.tentativas.push({ doencaId: doenca.id, resultado, acertou });
    campoPalpite.value = "";
    if (acertou) { estado.resolvido = true; finalizarPartida(true); }
    else renderJogo();
  }

  campoPalpite.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); submeterPalpite(); } });
  btnPalpitar.addEventListener("click", submeterPalpite);

  cardForm.appendChild(el("div", { class: "linha-palpite-form" }, [campoPalpite, datalist, btnPalpitar]));
  cardForm.appendChild(erroEl);
  cardForm.appendChild(renderLegenda());
  appEl.appendChild(cardForm);

  // Palpites mais recentes primeiro, pra não precisar rolar a tela.
  estado.tentativas.slice().reverse().forEach((t, i) => {
    const numero = estado.tentativas.length - i;
    appEl.appendChild(construirCartaoPalpite(t.doencaId, t.resultado, numero, t.acertou));
  });

  appEl.appendChild(el("section", { class: "card", style: "text-align:center" }, [
    el("button", { class: "btn fantasma", text: "⬅ Desistir e voltar ao início", onclick: renderIntro }),
  ]));

  campoPalpite.focus();
}

function finalizarPartida(acertou) {
  const registro = {
    completed: true, acertou, numeroTentativas: estado.tentativas.length,
    doencaAlvoId: estado.alvo.id, tentativas: estado.tentativas.map((t) => t.doencaId), timestamp: Date.now(),
  };
  if (!estado.modoPratica) {
    salvarProgressoLocal(registro);
    salvarTentativaRemota(registro);
  }
  renderResultado(registro);
}

function gerarGradeCompartilhar(tentativas) {
  const emojiPorCor = { verde: "🟩", amarelo: "🟨", laranja: "🟧", vermelho: "🟥" };
  return tentativas.map((t) => ORDEM_ATRIBUTOS.map(([chave]) => emojiPorCor[t.resultado[chave].cor]).join(""));
}

function renderResultado(registro) {
  limparApp();
  appEl.appendChild(renderMarca());

  const cardResumo = el("section", { class: "resumo-total card" }, [
    el("h2", { text: registro.acertou ? "Você acertou! 🎉" : "Fim de jogo" }),
    el("div", { class: "numero-grande", text: String(registro.numeroTentativas) }),
    el("p", { text: `palpite${registro.numeroTentativas === 1 ? "" : "s"} até ${registro.acertou ? "acertar" : "desistir"} — a doença era "${MAPA_DOENCAS[registro.doencaAlvoId].nome}".` }),
  ]);

  if (registro.acertou) dispararConfete(registro.numeroTentativas <= 3 ? "alta" : "media");

  const linhasEmoji = gerarGradeCompartilhar(estado.tentativas.length ? estado.tentativas : registro.tentativas.map((id) => ({ resultado: avaliarPalpite(MAPA_DOENCAS[id], MAPA_DOENCAS[registro.doencaAlvoId]) })));
  const gradeEl = el("div", { class: "grade-compartilhar" }, linhasEmoji.map((linha) =>
    el("div", { class: "linha-compartilhar", text: linha })
  ));
  cardResumo.appendChild(gradeEl);

  const btnCopiar = el("button", { class: "btn secundario", text: "📋 Copiar resultado" });
  btnCopiar.addEventListener("click", async () => {
    const texto = `Patological #${numeroRodada(estado.desafio.data)} — ${registro.acertou ? registro.numeroTentativas + "/∞" : "❌"}\n${linhasEmoji.join("\n")}`;
    try { await navigator.clipboard.writeText(texto); btnCopiar.textContent = "Copiado!"; setTimeout(() => { btnCopiar.textContent = "📋 Copiar resultado"; }, 1800); }
    catch (e) { console.warn("[Patological] Não foi possível copiar:", e); }
  });
  cardResumo.appendChild(btnCopiar);
  appEl.appendChild(cardResumo);

  appEl.appendChild(el("section", { class: "card", style: "text-align:center" }, [
    el("button", { class: "btn fantasma", text: "⬅ Voltar ao início", onclick: renderIntro }),
  ]));
}

function renderResultadoDeProgresso(progresso, data) {
  const desafio = data ? gerarDesafioDiario(data) : DESAFIO_DO_DIA;
  estado = { desafio, alvo: MAPA_DOENCAS[progresso.doencaAlvoId], tentativas: [], resolvido: true, modoPratica: false };
  renderResultado(progresso);
}

/* =========================================================================
 * 10. INICIALIZAÇÃO
 * ======================================================================= */
async function init() {
  if (DEBUG) console.log("[Patological] Modo debug ativo (?debug=1).");
  validarBancoDoencas();
  renderIntro();
  const [, bancoTrocou] = await Promise.all([verificarSessaoAtual(), carregarBancoRemoto()]);
  if (bancoTrocou) DESAFIO_DO_DIA = gerarDesafioDiario(DESAFIO_DO_DIA.data);
  if (sessao.usuario || bancoTrocou) renderIntro();
}
init();
</script>
