<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PatoVetZee — Desafio diário de patologia veterinária</title>
<meta name="description" content="Jogo diário de alocação: encaixe 9 doenças em 9 categorias clínicas, em ordem, sem voltar atrás.">
<!--
  Tenta carregar uma fonte arredondada e amigável do Google Fonts. Se não
  houver internet (ex.: uso 100% offline por file://), o @import simplesmente
  falha silenciosamente e a pilha de fallback (também arredondada/amigável)
  do CSS abaixo assume — o jogo funciona igual, só muda a fonte.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');

:root{
  --cor-fundo-1:#FFF1D6;
  --cor-fundo-2:#FFD9E8;
  --cor-primaria:#FF6B6B;
  --cor-primaria-escura:#E8534F;
  --cor-secundaria:#4ECDC4;
  --cor-secundaria-escura:#33A79F;
  --cor-acento:#C77DFF;
  --cor-sucesso:#2FBF71;
  --cor-alerta:#FFB800;
  --cor-texto:#3A2E39;
  --cor-texto-suave:#6b5f6a;
  --cor-card:#FFFFFF;
  --cor-card-borda:#3A2E39;
  --raio:22px;
  --raio-pequeno:14px;
  --sombra-sticker:0 6px 0 rgba(58,46,57,0.18), 0 10px 20px rgba(58,46,57,0.12);
  --sombra-sticker-pequena:0 4px 0 rgba(58,46,57,0.18), 0 6px 14px rgba(58,46,57,0.10);
  --fonte: 'Baloo 2', 'Comic Sans MS', 'Segoe UI Rounded', 'Trebuchet MS', Verdana, sans-serif;
  color-scheme: light;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  min-height:100%;
  font-family: var(--fonte);
  color: var(--cor-texto);
  background: radial-gradient(circle at 15% 10%, var(--cor-fundo-2), transparent 55%),
              radial-gradient(circle at 85% 90%, var(--cor-secundaria), transparent 45%),
              linear-gradient(160deg, var(--cor-fundo-1), var(--cor-fundo-2));
  background-attachment: fixed;
  overflow-x:hidden;
}

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

#app{
  max-width: 860px;
  margin: 0 auto;
  padding: 20px 16px 64px;
}

/* --------- Cabeçalho / marca --------- */
.marca{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin: 4px 0 18px;
}
.marca h1{
  font-size: clamp(28px, 6vw, 40px);
  margin:0;
  letter-spacing: 0.5px;
  color: var(--cor-primaria-escura);
  text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
}
.marca .mascote{ width:68px; height:52px; flex-shrink:0; }

/* --------- Cards genéricos "sticker" --------- */
.card{
  background: var(--cor-card);
  border: 3px solid var(--cor-card-borda);
  border-radius: var(--raio);
  box-shadow: var(--sombra-sticker);
  padding: 22px;
  margin-bottom: 18px;
}
.card h2{ margin-top:0; }

/* --------- Botões --------- */
.btn{
  font-family: inherit;
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  background: var(--cor-primaria);
  border: 3px solid var(--cor-card-borda);
  border-radius: 999px;
  padding: 14px 26px;
  min-height: 48px;
  min-width: 44px;
  cursor: pointer;
  box-shadow: var(--sombra-sticker-pequena);
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
  touch-action: manipulation;
}
.btn:hover{ filter: brightness(1.05); }
.btn:active{ transform: translateY(3px) scale(0.97); box-shadow: 0 1px 0 rgba(58,46,57,0.18); }
.btn:focus-visible{ outline: 3px solid var(--cor-acento); outline-offset: 3px; }
.btn.secundario{ background: var(--cor-secundaria); }
.btn.acento{ background: var(--cor-acento); }
.btn.fantasma{
  background: #fff; color: var(--cor-texto);
}
.btn:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }

.btn-categoria{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:16px;
  width:100%;
  text-align:left;
  font-size:16px;
  font-weight:700;
  font-family:inherit;
  color: var(--cor-texto);
  background: var(--cor-card);
  border:3px solid var(--cor-card-borda);
  border-radius: 18px;
  padding: 16px 18px 14px;
  min-height:104px;
  box-shadow: var(--sombra-sticker-pequena);
  cursor:pointer;
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, filter 0.15s;
}
.btn-categoria:hover{ filter: brightness(1.0); transform: translateY(-2px); box-shadow: 0 8px 0 rgba(58,46,57,0.18), 0 12px 22px rgba(58,46,57,0.14); }
.btn-categoria:active{ transform: translateY(3px); box-shadow:0 1px 0 rgba(58,46,57,0.18); filter:none; }
.btn-categoria:focus-visible{ outline: 3px solid var(--cor-card-borda); outline-offset:2px; }

/* Paleta cíclica pastel-vibrante — cada categoria pega uma cor de borda da
   roda, na ordem em que aparece, pra tela não ficar toda monocromática. */
.btn-categoria.cor-1{ border-color:#FF8C8C; }
.btn-categoria.cor-2{ border-color:#E8B93D; }
.btn-categoria.cor-3{ border-color:#3FBFA8; }
.btn-categoria.cor-4{ border-color:#59A9D9; }
.btn-categoria.cor-5{ border-color:#B18AE0; }
.btn-categoria.cor-6{ border-color:#E6789F; }

.btn-categoria .texto-categoria{ font-size:16px; font-weight:800; line-height:1.28; }

.btn-categoria .rodape-categoria{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.btn-categoria .cta-tocar{
  font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
  color: var(--cor-texto-suave);
}

.btn-categoria.confirmando{
  background: var(--cor-sucesso) !important;
  border-color: var(--cor-sucesso) !important;
  color:#fff;
  pointer-events:none;
}
.btn-categoria.confirmando .texto-categoria,
.btn-categoria.confirmando .cta-tocar{ color:#fff; }
.btn-categoria .check{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:50%; flex-shrink:0;
  background: #fff; color: var(--cor-sucesso); font-weight:800; font-size:13px;
  opacity:0; transform: scale(0.4);
  transition: opacity 0.2s, transform 0.25s cubic-bezier(.34,1.56,.64,1);
}
.btn-categoria.confirmando .check{ opacity:1; transform: scale(1); }

.grade-categorias{
  display:grid;
  grid-template-columns: 1fr;
  gap:12px;
}
@media (min-width:520px){
  .grade-categorias{ grid-template-columns: 1fr 1fr; }
}
@media (min-width:680px){
  .grade-categorias{ grid-template-columns: 1fr 1fr 1fr; }
}

/* --------- Lista de sistemas (Modo por sistemas) --------- */
.item-sistema{
  display:block;
  width:100%;
  text-align:left;
  font-size:16px;
  font-weight:700;
  font-family:inherit;
  color: var(--cor-texto);
  background: #FFF6E9;
  border:3px solid var(--cor-card-borda);
  border-radius: 20px;
  padding: 14px 18px;
  min-height:52px;
  margin-bottom:12px;
  box-shadow: var(--sombra-sticker-pequena);
  cursor:pointer;
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, filter 0.15s;
}
.item-sistema:hover:not(:disabled){ filter: brightness(1.03); transform: translateY(-2px); }
.item-sistema:active:not(:disabled){ transform: translateY(3px); box-shadow:0 1px 0 rgba(58,46,57,0.18); }
.item-sistema:focus-visible{ outline: 3px solid var(--cor-card-borda); outline-offset:2px; }

/* --------- Roteiro (sequência de doenças do dia) --------- */
.lista-roteiro{
  list-style:none; margin:0; padding:0;
  display:flex; flex-direction:column; gap:6px;
}
.item-roteiro{
  padding:9px 14px;
  border-radius:14px;
  font-size:14px;
  border:2px solid transparent;
}
.item-roteiro.futura{ background:#FFF6E9; color: var(--cor-texto); }
.item-roteiro.atual{
  background: var(--cor-alerta); color:#3A2E39; font-weight:800;
  border-color: var(--cor-card-borda);
}
.item-roteiro.feita{ background:transparent; color: var(--cor-texto-suave); text-decoration: line-through; }

/* --------- Selo de pontuação (revelado após cada escolha) --------- */
.badge-pontuacao{
  display:inline-block;
  font-size: clamp(28px, 7vw, 40px);
  font-weight:800;
  padding: 8px 26px;
  border-radius: 999px;
  border: 3px solid var(--cor-card-borda);
  margin: 12px 0 6px;
}
.badge-pontuacao.cheio{ background:#E9FBF2; color: var(--cor-sucesso); }
.badge-pontuacao.vazio{ background:#FFF1E9; color: var(--cor-texto-suave); }
.texto-explicacao{ font-size:15px; color: var(--cor-texto-suave); max-width:480px; margin:6px auto 0; }

/* --------- Doença atual (carta) --------- */
.carta-doenca{
  text-align:center;
  padding: 30px 20px;
  background: linear-gradient(135deg,#fff, #FFF6E9);
}
.carta-doenca .rotulo-passo{
  display:inline-block;
  background: var(--cor-secundaria);
  color:#fff; font-weight:700;
  border-radius: 999px; padding: 4px 14px; margin-bottom:10px;
  border: 2px solid var(--cor-card-borda);
}
.carta-doenca h2{
  font-size: clamp(22px, 6vw, 30px);
  margin: 8px 0 4px;
}
.carta-doenca .aviso-irreversivel{
  font-size:13px; color: var(--cor-texto-suave); margin-top:6px;
}
.icone-doenca{ width:72px; height:72px; margin:0 auto 8px; }

@keyframes cartaEntra{
  0%{ opacity:0; transform: translateY(24px) rotate(-3deg) scale(0.9); }
  60%{ opacity:1; transform: translateY(-4px) rotate(1deg) scale(1.02); }
  100%{ opacity:1; transform: translateY(0) rotate(0) scale(1); }
}
.carta-doenca.anim-entrada{ animation: cartaEntra 0.55s ease-out; }

/* --------- Painel de rodada (topo: total / doença atual / dia) --------- */
.painel-rodada{ padding: 18px 20px 14px; }
.painel-rodada .subtitulo-rodada{
  font-size:13px; color: var(--cor-texto-suave); margin:0 0 14px; text-align:center;
}
.rodada-stats{
  display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
  text-align:center;
}
.rodada-stats .bloco-stat{ flex:1; min-width:0; }
@media (max-width:480px){
  .rodada-stats{ flex-direction:column; align-items:center; gap:12px; }
}
.rodada-stats .rotulo-stat{
  font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
  color: var(--cor-texto-suave); margin-bottom:5px;
}
.rodada-stats .valor-total{
  font-size: clamp(28px,7vw,38px); font-weight:800; color: var(--cor-primaria-escura); line-height:1;
}
.rodada-stats .valor-doenca{
  font-size: clamp(15px,4vw,19px); font-weight:800; color: var(--cor-texto); line-height:1.2;
}
.rodada-stats .valor-rodada{ font-size:13px; color: var(--cor-texto-suave); font-weight:700; }
.rodada-stats .valor-rodada strong{ color: var(--cor-texto); }

/* --------- Rolo horizontal com a sequência do dia (chips numerados) ------ */
.rolo-sequencia{
  display:flex; gap:8px; overflow-x:auto; padding: 4px 4px 14px;
  scrollbar-width: thin;
}
.chip-doenca{
  flex:0 0 auto;
  width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:14px;
  border:2.5px solid var(--cor-card-borda);
  background:#fff; color: var(--cor-texto-suave);
  transition: transform 0.15s;
}
.chip-doenca.feita{ background: var(--cor-sucesso); color:#fff; border-color: var(--cor-sucesso); }
.chip-doenca.atual{
  background: var(--cor-alerta); color: var(--cor-texto); transform: scale(1.15);
  box-shadow: var(--sombra-sticker-pequena);
}
.chip-doenca.futura{ background:#FFF6E9; }

/* --------- Barra "SCORE" ao vivo (acumulado / teto teórico) --------- */
.painel-score{ padding: 14px 20px; }
.painel-score .linha-score{
  display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px;
}
.painel-score .rotulo-score{
  font-size:13px; font-weight:800; letter-spacing:1.5px; color: var(--cor-texto-suave);
}
.painel-score .fracao-score{ font-size:18px; font-weight:800; color: var(--cor-texto); }
.painel-score .barra-fina{
  height:14px; border-radius:999px; background:#eee; border:2px solid var(--cor-card-borda); overflow:hidden;
}
.painel-score .barra-fina .preenchimento{
  height:100%; background: linear-gradient(90deg, var(--cor-secundaria), var(--cor-sucesso));
  transition: width 0.4s ease-out;
}

/* --------- Resultado --------- */
.resumo-total{
  text-align:center; padding: 18px;
}
.resumo-total .numero-grande{
  font-size: clamp(40px,10vw,64px); font-weight:800; color: var(--cor-primaria-escura);
  line-height:1;
}
.barra-eficiencia{
  height: 22px; border-radius: 999px; background:#eee; border:2px solid var(--cor-card-borda);
  overflow:hidden; margin: 10px 0;
}
.barra-eficiencia .preenchimento{
  height:100%; background: linear-gradient(90deg, var(--cor-secundaria), var(--cor-sucesso));
  width:0%; transition: width 1s ease-out;
}

.linha-par{
  display:flex; justify-content:space-between; gap:10px;
  padding:10px 0; border-bottom: 2px dashed #eadfe0;
  opacity:0; transform: translateY(10px);
  animation: parEntra 0.4s ease-out forwards;
}
@keyframes parEntra{ to{ opacity:1; transform:none; } }
.linha-par:last-child{ border-bottom:none; }
.linha-par .pontos{ font-weight:800; white-space:nowrap; }
.linha-par .pontos.cheio{ color: var(--cor-sucesso); }
.linha-par .pontos.vazio{ color: var(--cor-texto-suave); }
.linha-par .explicacao{ font-size:14px; color: var(--cor-texto-suave); margin-top:2px; }

.tabela-otima{ width:100%; border-collapse: collapse; font-size:14px; }
.tabela-otima th, .tabela-otima td{ text-align:left; padding:6px 8px; border-bottom:1px solid #eee; }

/* --------- Confete --------- */
#confetti-layer{
  position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;
}
.confete{
  position:absolute; top:-20px; width:10px; height:16px;
  animation-name: cair; animation-timing-function: linear; animation-fill-mode: forwards;
  border-radius:3px;
}
@keyframes cair{
  0%{ transform: translateY(0) rotate(0deg); opacity:1; }
  100%{ transform: translateY(110vh) rotate(var(--rot,360deg)); opacity:0.9; }
}

.campo-erro{ color:#B00020; font-size:14px; white-space:pre-wrap; }

.rodape-nota{ text-align:center; font-size:12px; color: var(--cor-texto-suave); margin-top:24px; }

/* --------- Login / sessão / ranking --------- */
.campo{
  width:100%; font-family:inherit; font-size:16px;
  border:2px solid #ccc; border-radius: var(--raio-pequeno);
  padding:12px 14px; margin-bottom:12px; min-height:44px;
}
.campo:focus{ outline:3px solid var(--cor-acento); outline-offset:1px; border-color: var(--cor-acento); }
.rotulo-campo{ display:block; font-weight:700; margin-bottom:6px; }
.faixa-sessao{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#fff; border:3px solid var(--cor-card-borda); border-radius: var(--raio-pequeno);
  padding:10px 16px; margin-bottom:16px; flex-wrap:wrap;
}
.faixa-sessao strong{ color: var(--cor-primaria-escura); }
.aviso-config{
  background:#FFF3CD; border:2px dashed #B08900; color:#6b5400;
  border-radius: var(--raio-pequeno); padding:12px 16px; font-size:14px;
}
.abas-ranking{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.aba-ranking{
  font-family:inherit; font-weight:700; font-size:14px;
  border:3px solid var(--cor-card-borda); border-radius:999px;
  padding:8px 18px; min-height:44px; background:#fff; cursor:pointer;
  box-shadow: var(--sombra-sticker-pequena);
}
.aba-ranking.ativa{ background: var(--cor-secundaria); color:#fff; }
.tabela-ranking{ width:100%; border-collapse:collapse; font-size:15px; }
.tabela-ranking th, .tabela-ranking td{ text-align:left; padding:8px 10px; border-bottom:1px solid #eee; }
.tabela-ranking tr.minha-linha{ background:#FFF3CD; font-weight:800; }
.medalha{ font-size:18px; margin-right:4px; }

/* --------- Administração do banco de doenças --------- */
.btn-pequeno{ font-size:14px; padding:8px 16px; min-height:36px; }
.linha-admin-doenca{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 0; border-bottom:2px dashed #eadfe0; flex-wrap:wrap;
}
.linha-admin-doenca:last-child{ border-bottom:none; }
.linha-admin-info{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.linha-admin-meta{ font-size:13px; color: var(--cor-texto-suave); }
.linha-admin-acoes{ display:flex; gap:8px; flex-shrink:0; }

.grade-checkboxes{
  display:grid; grid-template-columns: 1fr; gap:10px 16px;
}
@media (min-width:560px){
  .grade-checkboxes{ grid-template-columns: 1fr 1fr; }
}
.item-checkbox{
  display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600;
  cursor:pointer;
}
.item-checkbox input[type="checkbox"]{ width:18px; height:18px; flex-shrink:0; cursor:pointer; }

.linha-gradual{ margin-bottom:16px; }
.linha-gradual:last-child{ margin-bottom:0; }
.campo-numero{ max-width:120px; }
.ajuda-campo{ font-size:12px; color: var(--cor-texto-suave); margin:4px 0 0; }

/* --------- Duelo 1v1 --------- */
.codigo-duelo{
  font-size: clamp(32px, 9vw, 48px); font-weight:800; letter-spacing:6px;
  color: var(--cor-primaria-escura); background:#FFF6E9;
  border:3px solid var(--cor-card-borda); border-radius: var(--raio-pequeno);
  padding: 12px 20px; margin: 14px auto; display:inline-block;
}
.comparativo-duelo{
  display:flex; align-items:center; justify-content:center; gap:16px;
  flex-wrap:wrap; margin-top:10px;
}
.lado-duelo{
  flex:1; min-width:130px; text-align:center; padding:14px;
  border:3px solid var(--cor-card-borda); border-radius: var(--raio-pequeno);
  background: #FFF6E9;
}
.lado-duelo.vencedor{ background: #E9FBF2; border-color: var(--cor-sucesso); }
.lado-duelo strong{ display:block; font-size:15px; margin-bottom:6px; }
.placar-duelo{ font-size: clamp(20px,5vw,28px); font-weight:800; color: var(--cor-primaria-escura); }
.versus-duelo{ font-size:22px; font-weight:800; color: var(--cor-texto-suave); }

@media (max-width:420px){
  .card{ padding:16px; }
}
</style>
</head>
<body>
<div id="app" role="main" aria-live="off"></div>
<div id="confetti-layer" aria-hidden="true"></div>
<div id="live-region" class="sr-only" role="status" aria-live="polite"></div>

<!--
  SDK do Supabase — só é usado para login e ranking (seção 10 do script
  abaixo). Se isto não carregar (sem internet, CDN bloqueado, etc.), o jogo
  inteiro continua funcionando normalmente em modo "sem login" — só login e
  ranking ficam indisponíveis, com um aviso claro na tela em vez de quebrar.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
"use strict";

/* =========================================================================
 * PatoVetZee — motor do jogo
 * -------------------------------------------------------------------------
 * Arquivo único, sem dependências externas obrigatórias, pensado para rodar
 * via file:// ou hospedagem estática simples.
 *
 * Organização (conforme pedido no briefing):
 *   1. Banco de doenças com parâmetros
 *   2. Definição do desafio do dia
 *   3. Utilitário de seed determinístico por data
 *   4. Algoritmo húngaro + testes internos
 *   5. Estado do jogo
 *   6. Renderização / DOM e animações
 *   7. Handlers de interação (clique/toque + teclado)
 *   8. Cálculo e exibição do resultado final
 *   9. Persistência local (localStorage)
 * ======================================================================= */


/* =========================================================================
 * 1. BANCO DE DOENÇAS COM PARÂMETROS
 * -------------------------------------------------------------------------
 * Por que este formato (e não uma matriz 9x9 por desafio):
 *   - O banco é a fonte de verdade clínica. Cada doença já carrega TODOS os
 *     parâmetros que possui (binários + graduais) de uma vez.
 *   - A pontuação de qualquer par doença×categoria nunca é armazenada — ela
 *     é sempre derivada em tempo real a partir daqui (ver calcularPontuacao,
 *     seção 5). Isso elimina a necessidade de preencher uma matriz nova a
 *     cada desafio.
 *   - Quando novas doenças forem adicionadas, basta acrescentar um objeto
 *     aqui com os mesmos ~60 campos preenchidos; elas já ficam disponíveis

    const tipoErrado = [];
    const desconhecidos = [];

    for (const id of idsBinarios) {
      if (!(id in (doenca.parametros_binarios || {}))) faltando.push(id);
      else if (typeof doenca.parametros_binarios[id] !== "boolean") tipoErrado.push(id);
    }
    for (const id of Object.keys(doenca.parametros_binarios || {})) {
      if (!idsBinarios.includes(id)) desconhecidos.push("binario:" + id);
    }

    for (const id of idsGraduais) {
      if (!(id in (doenca.parametros_graduais || {}))) faltando.push(id);
      else if (typeof doenca.parametros_graduais[id] !== "number" || doenca.parametros_graduais[id] < 0 || doenca.parametros_graduais[id] > 100) {
        tipoErrado.push(id + " (deve ser número entre 0 e 100)");
      }
    }
    for (const id of Object.keys(doenca.parametros_graduais || {})) {
      if (!idsGraduais.includes(id)) desconhecidos.push("gradual:" + id);
    }

    if (!doenca.sistema) faltando.push("sistema");
    else if (!(doenca.sistema in CATALOGO_SISTEMAS)) tipoErrado.push(`sistema (valor "${doenca.sistema}" não existe em CATALOGO_SISTEMAS)`);

    if (faltando.length || tipoErrado.length || desconhecidos.length) {
      problemas++;
      console.warn(
        `[PatoVetZee] Doença "${doenca.id}" (${doenca.nome}) tem problemas no banco de dados:` +
        (faltando.length ? `\n  faltando: ${faltando.join(", ")}` : "") +
        (tipoErrado.length ? `\n  valor com tipo/faixa inválidos: ${tipoErrado.join(", ")}` : "") +
        (desconhecidos.length ? `\n  chave desconhecida (possível erro de digitação): ${desconhecidos.join(", ")}` : "")
      );
    }
  }

  // Ids de doença duplicados também quebram o jogo (MAPA_DOENCAS silenciosamente
  // sobrescreve o anterior), então vale avisar.
  const contagem = {};
  BANCO_DOENCAS.forEach((d) => { contagem[d.id] = (contagem[d.id] || 0) + 1; });
  const duplicados = Object.entries(contagem).filter(([, n]) => n > 1).map(([id]) => id);
  if (duplicados.length) {
    problemas++;
    console.warn(`[PatoVetZee] Ids de doença duplicados no BANCO_DOENCAS: ${duplicados.join(", ")}`);
  }

  if (problemas === 0) {
    console.log(`[PatoVetZee] Banco de doenças OK: ${BANCO_DOENCAS.length} doenças, todos os ${idsBinarios.length + idsGraduais.length} parâmetros presentes e válidos.`);
  }
  return problemas === 0;
}

/* =========================================================================
 * 3. UTILITÁRIO DE SEED DETERMINÍSTICO POR DATA
 * ======================================================================= */

// Hash simples de string -> inteiro 32-bit (variante djb2/xfnv1a), só para
// transformar uma data (ou qualquer string) numa seed numérica estável.
function hashStringParaSeed(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

// PRNG determinístico (mulberry32) — mesmo seed sempre gera a mesma
// sequência de números em [0,1).
function criarGeradorPseudoAleatorio(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Embaralha `array` de forma determinística a partir de `seedTexto`
// (Fisher-Yates). Não modifica o array original.
function embaralharComSeed(array, seedTexto) {
  const rand = criarGeradorPseudoAleatorio(hashStringParaSeed(seedTexto));
  const copia = array.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}


/* =========================================================================
 * 4. ALGORITMO HÚNGARO (Kuhn-Munkres) + TESTES INTERNOS
 * -------------------------------------------------------------------------
 * Adaptado para MAXIMIZAÇÃO (minimizamos o custo = -pontuação). Testado
 * isoladamente antes de integrar (ver hungarian.js na mesma pasta para a
 * versão executável via `node hungarian.js`).
 * ======================================================================= */

function hungarianMinCost(costMatrix) {
  const n = costMatrix.length;
  const INF = Infinity;
  const u = new Array(n + 1).fill(0);
  const v = new Array(n + 1).fill(0);
  const p = new Array(n + 1).fill(0);
  const way = new Array(n + 1).fill(0);

  for (let i = 1; i <= n; i++) {
    p[0] = i;
    let j0 = 0;
    const minv = new Array(n + 1).fill(INF);
    const used = new Array(n + 1).fill(false);
    do {
      used[j0] = true;
      const i0 = p[j0];
      let delta = INF;
      let j1 = -1;
      for (let j = 1; j <= n; j++) {
        if (!used[j]) {
          const cur = costMatrix[i0 - 1][j - 1] - u[i0] - v[j];
          if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
          if (minv[j] < delta) { delta = minv[j]; j1 = j; }
        }
      }
      for (let j = 0; j <= n; j++) {
        if (used[j]) { u[p[j]] += delta; v[j] -= delta; }
        else { minv[j] -= delta; }
      }
      j0 = j1;
    } while (p[j0] !== 0);
    do {
      const j1 = way[j0];
      p[j0] = p[j1];
      j0 = j1;
    } while (j0 !== 0);
  }

  const assignment = new Array(n);
  for (let j = 1; j <= n; j++) if (p[j] > 0) assignment[p[j] - 1] = j - 1;
  const totalCost = assignment.reduce((s, col, row) => s + costMatrix[row][col], 0);
  return { assignment, totalCost, u, v };
}

// API pública: recebe scoreMatrix[doenca][categoria] (0-100 ou qualquer
// número) e devolve a alocação que MAXIMIZA a soma.
function hungarianMaxAssignment(scoreMatrix) {
  const n = scoreMatrix.length;
  const costMatrix = scoreMatrix.map((row) => row.map((s) => -s));
  const { assignment, totalCost, u, v } = hungarianMinCost(costMatrix);
  const totalScore = -totalCost;

  // Heurística de empate: conta arestas de custo reduzido zero no grafo
  // completo. Mais que n arestas de custo zero é indício forte (não prova
  // formal) de que existe alocação alternativa com a mesma soma ótima.
  let arestasZero = 0;
  const EPS = 1e-9;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (Math.abs(costMatrix[i][j] - u[i + 1] - v[j + 1]) < EPS) arestasZero++;
    }
  }
  return { assignment, totalScore, hasMultipleOptima: arestasZero > n };
}

function rodarTestesInternosHungaro() {
  function aproxIgual(a, b, eps = 1e-6) { return Math.abs(a - b) < eps; }
  const testes = [
    { nome: "diagonal dominante", matriz: [[100,0,0],[0,100,0],[0,0,100]], soma: 300, multiplos: false },
    { nome: "2x2 empatado", matriz: [[100,100],[100,100]], soma: 200, multiplos: true },
    { nome: "3x3 aditiva degenerada", matriz: [[1,2,3],[4,5,6],[7,8,9]], soma: 15, multiplos: true },
    { nome: "4x4 bloco empatado + bloco único", matriz: [[100,100,0,0],[100,100,0,0],[0,0,100,50],[0,0,50,100]], soma: 400, multiplos: true },
  ];
  let ok = true;
  console.log("=== PatoVetZee — testes internos do algoritmo húngaro ===");
  for (const t of testes) {
    const r = hungarianMaxAssignment(t.matriz);
    const somaOk = aproxIgual(r.totalScore, t.soma);
    const multOk = r.hasMultipleOptima === t.multiplos;
    ok = ok && somaOk && multOk;
    console.log(`[${somaOk && multOk ? "PASSOU" : "FALHOU"}] ${t.nome}: soma=${r.totalScore} (esperado ${t.soma}), múltiplos=${r.hasMultipleOptima} (esperado ${t.multiplos})`);
  }
  console.log(ok ? "Todos os testes do húngaro passaram." : "Há testes com falha no húngaro — revisar.");
  return ok;
}

const STORAGE_PREFIXO_PROGRESSO = "patovetzee_progresso_";
const STORAGE_HISTORICO = "patovetzee_historico";
const DEBUG = new URLSearchParams(location.search).get("debug") === "1";

// Estado mutável único do jogo em andamento (reset a cada nova partida).
let estado = {
  desafio: null,
  ordemCategoriasIds: [],      // ordem "de exibição" (embaralhada por seed), reduz a cada escolha
  ordemDoencasIds: [],         // ordem fixa de apresentação das 9 doenças
  matriz: null,                // matriz[doencaId][categoriaId] = pontuação
  indiceAtual: 0,               // 0..8, índice da doença atual na sequência
  alocacoes: [],                // [{doencaId, categoriaId, score}], em ordem de confirmação
  modoPratica: false,           // true = desafio personalizado ou "jogar de novo"; não conta como oficial
  travaInteracao: false,        // evita duplo clique durante animação de confirmação
};

// Deriva a pontuação de um par (doença, parâmetro) diretamente do banco —
// nunca é armazenada, sempre calculada.
function calcularPontuacao(doencaId, paramRef) {
  const doenca = MAPA_DOENCAS[doencaId];
  if (!doenca) return 0;
  if (paramRef.grupo === "binario") {
    return doenca.parametros_binarios[paramRef.id] ? 100 : 0;
  }
  return doenca.parametros_graduais[paramRef.id];
}

// Monta a matriz completa doença×categoria para o desafio (usada pelo
// húngaro e para exibir a pontuação de cada escolha do jogador).
function construirMatriz(desafio) {
  const matriz = {};
  for (const doencaId of desafio.doencas_selecionadas) {
    matriz[doencaId] = {};
    for (const paramRef of desafio.parametros_selecionados) {
      matriz[doencaId][paramRef.id] = calcularPontuacao(doencaId, paramRef);
    }
  }
  return matriz;
}

// Variância dos valores de um parâmetro entre um conjunto de doenças — usada
// para escolher automaticamente boas categorias quando não há uma curadoria
// manual (caso do "Modo por sistemas", seção 11). Quanto maior a variância,
// mais aquele parâmetro diferencia as doenças (menos chance de virar uma
// categoria "sem graça" onde todo mundo dá o mesmo valor).
function calcularVarianciaParametro(doencaIds, paramRef) {
  const valores = doencaIds.map((id) => calcularPontuacao(id, paramRef));
  const media = valores.reduce((a, v) => a + v, 0) / valores.length;
  return valores.reduce((a, v) => a + (v - media) ** 2, 0) / valores.length;
}

// Pontuação húngara máxima alcançável usando SÓ as categorias em
// `categorias` para todas as doenças em `doencaIds` (mesmo quando
// categorias.length < doencaIds.length) — completa a matriz com colunas
// fictícias de custo 0 até ficar quadrada, então o húngaro naturalmente
// escolhe as melhores `categorias.length` doenças para preencher essas
// colunas e deixa o resto "sobrando" a 0, sem afetar o resultado.
function avaliarTetoCategoriasParciais(doencaIds, categorias) {
  const m = doencaIds.length;
  const matriz = doencaIds.map((dId) => {
    const linha = categorias.map((ref) => calcularPontuacao(dId, ref));
    while (linha.length < m) linha.push(0);
    return linha;
  });
  return hungarianMaxAssignment(matriz).totalScore;
}

// Escolhe `quantidade` categorias (entre binárias e graduais) para
// `doencaIds`. Não basta ordenar por variância isolada: duas categorias de
// alta variância podem, juntas, "competir" pelas mesmas 2-3 doenças e
// forçar uma alocação ótima com zeros (mesmo havendo combinações sem
// nenhum zero). Por isso a escolha é gulosa: a cada passo, adiciona a
// categoria que mais aumenta a pontuação húngara máxima alcançável pelo
// conjunto escolhido até agora — maximiza diretamente o teto teórico do
// desafio, em vez de só "parecer" boa categoria a categoria.
function escolherCategoriasAutomaticamente(doencaIds, quantidade) {
  const candidatos = [
    ...Object.keys(CATALOGO_PARAMETROS.binarios).map((id) => ({ id, grupo: "binario" })),
    ...Object.keys(CATALOGO_PARAMETROS.graduais).map((id) => ({ id, grupo: "gradual" })),
  ]
    .map((ref) => ({ ...ref, variancia: calcularVarianciaParametro(doencaIds, ref) }))
    .filter((c) => c.variancia > 0) // descarta parâmetros constantes (categoria sem utilidade)
    .sort((a, b) => b.variancia - a.variancia);

  if (candidatos.length <= quantidade) {
    return candidatos.slice(0, quantidade).map(({ id, grupo }) => ({ id, grupo }));
  }

  const restantes = candidatos.slice();
  const selecionadas = [];
  for (let passo = 0; passo < quantidade; passo++) {
    let melhorIdx = 0;
    let melhorTeto = -Infinity;
    for (let i = 0; i < restantes.length; i++) {
      const teto = avaliarTetoCategoriasParciais(doencaIds, selecionadas.concat(restantes[i]));
      // Empate no teto: prefere a de maior variância (já vem ordenado assim).
      if (teto > melhorTeto) { melhorTeto = teto; melhorIdx = i; }
    }
    selecionadas.push(restantes[melhorIdx]);
    restantes.splice(melhorIdx, 1);
  }
  return selecionadas.map(({ id, grupo }) => ({ id, grupo }));
}

// Gera uma explicação genérica a partir do próprio dado, para quando não há
// um texto curado (típico do "Modo por sistemas", que monta combinações
// dinamicamente — curar 1 explicação por par doença×categoria ali não é
// viável). Menos rico que uma explicação clínica escrita à mão, mas ainda
// assim informativo, em vez de um "não disponível" vazio.
function gerarExplicacaoAutomatica(doencaId, categoriaId, score) {
  const doenca = MAPA_DOENCAS[doencaId];
  const label = obterLabelParametro(categoriaId);
  const ehGradual = categoriaId in CATALOGO_PARAMETROS.graduais;
  if (ehGradual) {
    return `${doenca.nome} recebeu nota ${score}/100 nesta categoria no banco de dados.`;
  }
  return score === 100
    ? `Sim: no banco de dados, "${doenca.nome}" apresenta a característica "${label}".`
    : `Não: no banco de dados, "${doenca.nome}" não apresenta a característica "${label}".`;
}

// Checagem simples de "qualidade do desafio" (pedida no briefing): avisa no
// console quando a seleção de parâmetros gera pouca variação (puzzle sem
// graça) — não bloqueia o jogo, é só um alerta para quem está curando o
// conteúdo do dia.
function avaliarQualidadeDesafio(desafio, matriz) {
  const doencaIds = desafio.doencas_selecionadas;
  const paramRefs = desafio.parametros_selecionados;

  // Categorias "constantes": todas as doenças têm o mesmo valor.
  let categoriasConstantes = 0;
  for (const ref of paramRefs) {
    const valores = doencaIds.map((id) => matriz[id][ref.id]);
    if (valores.every((v) => v === valores[0])) categoriasConstantes++;
  }

  // Doenças com pelo menos um "true isolado" (100 sem empate) em alguma
  // categoria binária selecionada.
  const doencasComTrueIsolado = new Set();
  for (const ref of paramRefs) {
    if (ref.grupo !== "binario") continue;
    const valores = doencaIds.map((id) => matriz[id][ref.id]);
    const indicesComCem = valores.reduce((acc, v, i) => (v === 100 ? acc.concat(i) : acc), []);
    if (indicesComCem.length === 1) doencasComTrueIsolado.add(doencaIds[indicesComCem[0]]);
  }

  const nGraduais = paramRefs.filter((r) => r.grupo === "gradual").length;
  const misturaForaDoRecomendado =
    nGraduais < MIX_RECOMENDADO.min_graduais || nGraduais > MIX_RECOMENDADO.max_graduais;

  console.log(
    `[PatoVetZee] Checagem de qualidade do desafio "${desafio.id}": ` +
    `${categoriasConstantes} categoria(s) constante(s) de ${paramRefs.length}; ` +
    `${doencasComTrueIsolado.size} doença(s) com valor isolado; ` +
    `${nGraduais} categoria(s) gradual(is) (recomendado ${MIX_RECOMENDADO.min_graduais}-${MIX_RECOMENDADO.max_graduais}).`
  );
  if (categoriasConstantes > 3) {
    console.warn(
      `[PatoVetZee] AVISO: ${categoriasConstantes} categorias têm o mesmo valor para todas as doenças — ` +
      `esse desafio pode estar com pouca variação e ficar sem graça. Considere trocar alguns parâmetros.`
    );
  }
  if (misturaForaDoRecomendado) {
    console.warn(
      `[PatoVetZee] AVISO: mistura de ${nGraduais} categorias graduais está fora da faixa recomendada ` +
      `(${MIX_RECOMENDADO.min_graduais}-${MIX_RECOMENDADO.max_graduais}).`
    );
  }
}

// Inicializa `estado` a partir de um objeto de desafio (oficial ou
// personalizado), calculando ordem determinística e a matriz de pontuação.
// Monta a matriz n×n na ordem fixa doencas_selecionadas × parametros_selecionados
// e resolve o húngaro — usado tanto para cachear a pontuação ótima teórica
// no início da partida (exibida ao vivo na barra de placar) quanto no
// cálculo do resultado final.
function resolverAlocacaoOtima(desafio, matriz) {
  const doencaIds = desafio.doencas_selecionadas;
  const catIds = desafio.parametros_selecionados.map((r) => r.id);
  const matrizNumerica = doencaIds.map((dId) => catIds.map((cId) => matriz[dId][cId]));
  const otimo = hungarianMaxAssignment(matrizNumerica);
  return { doencaIds, catIds, matrizNumerica, otimo };
}

// Data de lançamento do jogo — base para numerar as rodadas diárias
// (rodada #1 = dia do lançamento, incrementa 1 por dia).
const DATA_LANCAMENTO_JOGO = "2026-08-05";
function numeroRodada(dataStr) {
  const inicio = new Date(DATA_LANCAMENTO_JOGO + "T00:00:00");
  const alvo = new Date((dataStr || DATA_LANCAMENTO_JOGO) + "T00:00:00");
  const dias = Math.round((alvo - inicio) / 86400000);
  return Math.max(1, dias + 1);
}
const DIAS_SEMANA_PT = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
const MESES_PT = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
function formatarDataExtenso(dataStr) {
  if (!dataStr) return "";
  const d = new Date(dataStr + "T00:00:00");
  if (isNaN(d)) return "";
  return `${capitalizar(DIAS_SEMANA_PT[d.getDay()])}, ${d.getDate()} de ${MESES_PT[d.getMonth()]}`;
}
function capitalizar(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function iniciarPartida(desafio, { pratica = false } = {}) {
  const matriz = construirMatriz(desafio);
  avaliarQualidadeDesafio(desafio, matriz);

  const seedBase = (desafio.id || desafio.data || "desafio") + (pratica ? "|" + Date.now() : "");
  const ordemDoencasIds = embaralharComSeed(desafio.doencas_selecionadas, seedBase + "|ordem-doencas");
  const ordemCategoriasIds = embaralharComSeed(
    desafio.parametros_selecionados.map((r) => r.id),
    seedBase + "|ordem-categorias"
  );

  // Pontuação ótima teórica é calculada uma vez, aqui — não depende das
  // escolhas do jogador, só do desafio em si — para poder mostrar
  // "SCORE acumulado / teto teórico" ao vivo durante a partida.
  const { otimo } = resolverAlocacaoOtima(desafio, matriz);

  estado = {
    desafio,
    matriz,
    ordemDoencasIds,
    ordemCategoriasIds,
    indiceAtual: 0,
    alocacoes: [],
    modoPratica: pratica,
    travaInteracao: false,
    pontuacaoOtimaTeorica: otimo.totalScore,
  };
}

const appEl = document.getElementById("app");
const liveRegionEl = document.getElementById("live-region");

function anunciar(texto) {
  liveRegionEl.textContent = "";
  // pequeno delay para o leitor de tela perceber a mudança mesmo se o texto
  // for igual ao anterior.
  requestAnimationFrame(() => { liveRegionEl.textContent = texto; });
}

// Helper mínimo para montar DOM sem innerHTML (evita risco de conteúdo de
// desafios personalizados quebrar a página).
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else if (v !== false && v !== null && v !== undefined) node.setAttribute(k, v);
    }
  }
  (children || []).forEach((c) => { if (c) node.appendChild(c); });
  return node;
}

// Painel de topo da rodada (estilo "round info"): total acumulado, doença
// sendo alocada agora (ou label genérico na tela de revelação) e o número/
// data da rodada diária. `doencaEmFoco` é null na tela de revelação (ali
// quem importa é o par já confirmado, mostrado em outro card).
function construirPainelRodada(doencaEmFoco, subtitulo) {
  const desafio = estado.desafio;
  const totalAcumulado = estado.alocacoes.reduce((s, a) => s + a.score, 0);

  const blocoTotal = el("div", { class: "bloco-stat" }, [
    el("div", { class: "rotulo-stat", text: "Total" }),
    el("div", { class: "valor-total", text: String(totalAcumulado) }),
  ]);
  const blocoDoenca = el("div", { class: "bloco-stat" }, [
    el("div", { class: "rotulo-stat", text: doencaEmFoco ? "Alocando agora" : "Última alocação" }),
    el("div", { class: "valor-doenca", text: doencaEmFoco ? doencaEmFoco.nome : "—" }),
  ]);
  const blocoRodada = el("div", { class: "bloco-stat" }, [
    el("div", { class: "rotulo-stat", text: estado.modoPratica ? "Modo prática" : "Desafio diário" }),
    el("div", { class: "valor-rodada" }, [
      document.createTextNode(estado.modoPratica ? "" : `#${numeroRodada(desafio.data)} · `),
      el("strong", { text: formatarDataExtenso(desafio.data) || desafio.titulo }),
    ]),
  ]);

  return el("section", { class: "card painel-rodada" }, [
    el("p", { class: "subtitulo-rodada", text: subtitulo }),
    el("div", { class: "rodada-stats" }, [blocoTotal, blocoDoenca, blocoRodada]),
  ]);
}

// Rolo horizontal com um "chip" numerado por doença do dia — versão
// compacta da sequência (a lista com os nomes completos continua abaixo,
// pois o jogador precisa dela pra planejar). `doencasFeitasCount` = quantas
// já foram alocadas; `indiceEmDestaque` = índice a marcar como "atual" (ou
// -1 se nenhuma — usado na tela intermediária de revelação de pontuação).
function construirRoloSequencia(doencasFeitasCount, indiceEmDestaque) {
  return el("div", { class: "rolo-sequencia", "aria-hidden": "true" },
    estado.ordemDoencasIds.map((_, i) => {
      const status = i < doencasFeitasCount ? "feita" : i === indiceEmDestaque ? "atual" : "futura";
      return el("div", {
        class: "chip-doenca " + status,
        text: status === "feita" ? "✓" : String(i + 1),
      });
    })
  );
}

// Barra "SCORE" fina, ao vivo: acumulado / teto teórico do desafio.
function construirBarraScoreTopo() {
  const acumulado = estado.alocacoes.reduce((s, a) => s + a.score, 0);
  const teto = estado.pontuacaoOtimaTeorica || 0;
  const pct = teto > 0 ? Math.min(100, (acumulado / teto) * 100) : 0;
  return el("section", { class: "card painel-score" }, [
    el("div", { class: "linha-score" }, [
      el("span", { class: "rotulo-score", text: "SCORE" }),
      el("span", { class: "fracao-score", text: `${acumulado} / ${teto}` }),
    ]),
    el("div", { class: "barra-fina" }, [
      el("div", { class: "preenchimento", style: `width:${pct}%` }),
    ]),
  ]);
}

// Roteiro completo do dia: o jogador só ALOCA a doença atual, mas já sabe
// quais são todas as outras 8 (e em que ordem vão aparecer) — isso é
// proposital, pra ele conseguir planejar em qual categoria vale mais a pena
// "gastar" a doença de agora, pensando no que ainda vem.
function construirCardRoteiro(doencasFeitasCount, indiceEmDestaque) {
  const cardRoteiro = el("section", { class: "card" }, [
    el("h2", { text: "Sequência de doenças de hoje" }),
  ]);
  const listaRoteiro = el("ol", { class: "lista-roteiro" },
    estado.ordemDoencasIds.map((id, i) => {
      const d = MAPA_DOENCAS[id];
      const status = i < doencasFeitasCount ? "feita" : i === indiceEmDestaque ? "atual" : "futura";
      const icone = status === "feita" ? "✅" : status === "atual" ? "👉" : "⏳";
      return el("li", { class: "item-roteiro " + status }, [
        el("span", { "aria-hidden": "true", text: icone + " " }),
        document.createTextNode(d.nome),
      ]);
    })
  );
  cardRoteiro.appendChild(listaRoteiro);
  return cardRoteiro;
}

/* --------- Tela: doença atual --------- */

/* --------- Tela intermediária: pontuação da escolha que acabou de ser
   confirmada --------- */
// Aparece entre uma doença e a próxima: mostra quantos pontos aquele par
// doença-categoria valeu e a explicação clínica, antes de revelar a doença
// seguinte. Continua irreversível — é só uma revelação, não dá pra trocar.
function renderPontuacaoEscolha(doencaId, categoriaId, score) {
  limparApp();
  const doenca = MAPA_DOENCAS[doencaId];
  const label = obterLabelParametro(categoriaId);
  const explicacao = (estado.desafio.explicacoes[doencaId] && estado.desafio.explicacoes[doencaId][categoriaId]) ||
    gerarExplicacaoAutomatica(doencaId, categoriaId, score);
  const indiceConfirmado = estado.indiceAtual; // ainda não incrementado neste ponto
  const ehUltima = indiceConfirmado + 1 >= estado.ordemDoencasIds.length;

  appEl.appendChild(renderMarca());
  appEl.appendChild(construirPainelRodada(null, "Resultado da última alocação — confira antes de seguir para a próxima."));
  appEl.appendChild(construirRoloSequencia(estado.alocacoes.length, -1));
  appEl.appendChild(construirBarraScoreTopo());

  const cardPontuacao = el("section", { class: "card carta-doenca anim-entrada", "aria-live": "polite" }, [
    el("span", { class: "rotulo-passo", text: `Doença ${indiceConfirmado + 1} de ${estado.ordemDoencasIds.length}` }),
    el("h2", { text: `${doenca.nome} → ${label}` }),
    el("div", { class: "badge-pontuacao " + (score >= 50 ? "cheio" : "vazio"), text: `${score} pontos` }),
    el("p", { class: "texto-explicacao", text: explicacao }),
  ]);
  appEl.appendChild(cardPontuacao);

  appEl.appendChild(construirCardRoteiro(estado.alocacoes.length, -1));

  const cardContinuar = el("section", { class: "card", style: "text-align:center" }, [
    el("button", {
      class: "btn",
      text: ehUltima ? "Ver resultado final ➡" : "Próxima doença ➡",
      onclick: () => {
        estado.indiceAtual++;
        estado.travaInteracao = false;
        if (estado.indiceAtual < estado.ordemDoencasIds.length) renderDoencaAtual();
        else renderResultado();
      },
    }),
  ]);
  appEl.appendChild(cardContinuar);

  anunciar(`${doenca.nome} alocada em ${label}. Pontuação: ${score} pontos.`);
}

function obterLabelParametro(paramId) {
  return (
    (CATALOGO_PARAMETROS.binarios[paramId] && CATALOGO_PARAMETROS.binarios[paramId].label) ||
    (CATALOGO_PARAMETROS.graduais[paramId] && CATALOGO_PARAMETROS.graduais[paramId].label) ||
    paramId
  );
}

/* --------- Confete --------- */
function dispararConfete(intensidade) {
  const cores = ["#FF6B6B", "#FFD166", "#06D6A0", "#4ECDC4", "#C77DFF"];
  const camada = document.getElementById("confetti-layer");
  const n = intensidade === "alta" ? 70 : 28;
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confete";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = cores[Math.floor(Math.random() * cores.length)];
    c.style.animationDuration = 2 + Math.random() * 1.5 + "s";
    c.style.animationDelay = Math.random() * 0.4 + "s";
    c.style.setProperty("--rot", Math.random() * 360 + "deg");
    camada.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}


/* =========================================================================
 * 7. HANDLERS DE INTERAÇÃO (clique/toque + teclado)
 * ======================================================================= */

function onEscolherCategoria(categoriaId, botaoEl) {
  if (estado.travaInteracao) return;
  estado.travaInteracao = true;

  const doencaId = estado.ordemDoencasIds[estado.indiceAtual];
  const score = estado.matriz[doencaId][categoriaId];

  // Desabilita todos os botões da grade e mostra o feedback "confirmado" no
  // botão escolhido (um "check" animado) antes de revelar a pontuação na
  // tela seguinte.
  const grade = botaoEl.closest(".grade-categorias");
  grade.querySelectorAll("button").forEach((b) => { b.disabled = true; b.tabIndex = -1; });
  botaoEl.classList.add("confirmando");
  botaoEl.setAttribute("aria-selected", "true");

  anunciar(`Confirmado: ${MAPA_DOENCAS[doencaId].nome} alocada. Calculando pontuação...`);

  estado.alocacoes.push({ doencaId, categoriaId, score });

  setTimeout(() => {
    renderPontuacaoEscolha(doencaId, categoriaId, score);
  }, 550);
}

// Navegação por setas dentro da grade de categorias (roving focus simples).
// Enter/Espaço já funcionam nativamente em <button>.
function configurarNavegacaoTeclado(grade) {
  grade.addEventListener("keydown", (ev) => {
    const botoes = Array.from(grade.querySelectorAll("button:not([disabled])"));
    const atual = document.activeElement;
    const i = botoes.indexOf(atual);
    if (i === -1) return;

    let proximo = null;
    if (ev.key === "ArrowDown" || ev.key === "ArrowRight") proximo = botoes[(i + 1) % botoes.length];
    else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") proximo = botoes[(i - 1 + botoes.length) % botoes.length];
    else if (ev.key === "Home") proximo = botoes[0];
    else if (ev.key === "End") proximo = botoes[botoes.length - 1];

    if (proximo) {
      ev.preventDefault();
      proximo.focus();
    }
  });
}


/* =========================================================================
 * 8. CÁLCULO E EXIBIÇÃO DO RESULTADO FINAL
 * ======================================================================= */

function calcularResultadoFinal() {
  const desafio = estado.desafio;
  const totalScore = estado.alocacoes.reduce((s, a) => s + a.score, 0);

  // Reaproveita a mesma resolução húngara usada no início da partida (a
  // ordem de exibição ao jogador foi só cosmética, o resultado é o mesmo).
  const { doencaIds, catIds, matrizNumerica, otimo } = resolverAlocacaoOtima(desafio, estado.matriz);
  const optimalScore = otimo.totalScore;
  const alocacaoOtima = otimo.assignment.map((catIdx, doencaIdx) => ({
    doencaId: doencaIds[doencaIdx],
    categoriaId: catIds[catIdx],
    score: matrizNumerica[doencaIdx][catIdx],
  }));

  const efficiency = optimalScore > 0 ? (totalScore / optimalScore) * 100 : 100;

  return { totalScore, optimalScore, efficiency, alocacaoOtima, hasMultipleOptima: otimo.hasMultipleOptima };
}

// Identifica o "modo" de uma partida pra fins de acompanhamento (tabela
// `tentativas`, seção 10) — não afeta o ranking oficial, que continua
// governado só por `estado.modoPratica`/`estado.desafio.personalizado`
// dentro de salvarResultadoRemoto.
function determinarModoTentativa() {
  if (estado.duelo) return null; // duelos são registrados à parte, em finalizarDuelo()
  // Checa o id ANTES de olhar `personalizado`: Modo por Sistemas também usa
  // personalizado=true (só pra reaproveitar a lógica de "fora do ranking
  // oficial"), mas ainda assim deve ser rastreado aqui pro painel do
  // professor — só um desafio custom colado via JSON de verdade fica fora.
  const id = String(estado.desafio.id || "");
  if (id.startsWith("sistema-")) return { modo: "sistema", detalhe: id.slice("sistema-".length) };
  if (estado.desafio.id === DESAFIO_DO_DIA.id) return { modo: "diario", detalhe: null };
  return null; // desafio personalizado (JSON colado) ou outro caso não mapeado — não rastreado
}

function renderResultado() {
  const resultado = calcularResultadoFinal();
  if (estado.duelo) { finalizarDuelo(resultado); return; }
  salvarResultado(resultado);
  const infoModo = determinarModoTentativa();
  if (infoModo) salvarTentativa(resultado, infoModo.modo, infoModo.detalhe);
  renderTelaResultado(resultado);
}

// Permite reabrir o resultado de uma partida já salva (sem recalcular).

}


/* =========================================================================
 * 9. PERSISTÊNCIA LOCAL (localStorage)
 * ======================================================================= */

function salvarResultado(resultado) {
  const registro = {
    completed: true,
    timestamp: Date.now(),
    desafioId: estado.desafio.id,
    totalScore: resultado.totalScore,
    optimalScore: resultado.optimalScore,
    efficiency: resultado.efficiency,
    alocacoesJogador: estado.alocacoes,
  };

  if (!estado.modoPratica) {
    try {
      localStorage.setItem(STORAGE_PREFIXO_PROGRESSO + estado.desafio.id, JSON.stringify(registro));
    } catch (e) {
      console.warn("[PatoVetZee] Não foi possível salvar o progresso no localStorage:", e);
    }
  }

  // Histórico sempre recebe a partida (oficial ou prática), para consulta.
  try {
    const historico = lerHistorico();
    historico.unshift({
      desafioId: estado.desafio.id,
      titulo: estado.desafio.titulo,
      data: estado.desafio.data || null,
      pratica: estado.modoPratica,
      totalScore: resultado.totalScore,
      optimalScore: resultado.optimalScore,
      efficiency: resultado.efficiency,
      timestamp: Date.now(),
    });
    localStorage.setItem(STORAGE_HISTORICO, JSON.stringify(historico.slice(0, 50)));
  } catch (e) {
    console.warn("[PatoVetZee] Não foi possível salvar o histórico no localStorage:", e);
  }

  // Sincronização remota (login/ranking) é best-effort e assíncrona — não
  // bloqueia a tela de resultado nem quebra nada se estiver sem internet ou
  // sem login (ver seção 10).
  salvarResultadoRemoto(resultado);
}

function carregarProgresso(desafioId) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIXO_PROGRESSO + desafioId);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    console.warn("[PatoVetZee] Não foi possível ler o progresso salvo:", e);
    return null;
  }
}

function lerHistorico() {
  try {
    const raw = localStorage.getItem(STORAGE_HISTORICO);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.warn("[PatoVetZee] Não foi possível ler o histórico salvo:", e);
    return [];
  }
}

function renderHistorico() {
  limparApp();
  appEl.appendChild(renderMarca());
  const historico = lerHistorico();
  const card = el("section", { class: "card" }, [el("h2", { text: "Histórico de desafios jogados" })]);
  if (historico.length === 0) {
    card.appendChild(el("p", { text: "Ainda não há partidas registradas neste navegador." }));
  } else {
    historico.forEach((h) => {
      card.appendChild(el("div", { class: "linha-par" }, [
        el("div", {}, [
          el("div", { text: `${h.titulo || h.desafioId}${h.pratica ? " (prática)" : ""}` }),
          el("div", { class: "explicacao", text: new Date(h.timestamp).toLocaleString("pt-BR") }),
        ]),
        el("div", { class: "pontos cheio", text: `${h.totalScore}/${h.optimalScore}` }),
      ]));
    });
  }
  card.appendChild(el("button", { class: "btn secundario", text: "⬅ Voltar", onclick: renderIntro }));
  appEl.appendChild(card);
}

const SUPABASE_URL = "https://wyyxuvnrlutqjxtamhus.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_XVuuDOCgMTxtXCSMxq5IwQ_0uRk5M4s";

// Só ativa o cliente se as constantes acima foram preenchidas E o SDK do
// Supabase carregou (ver <script src=".../supabase-js"> no <head>). Se
// qualquer uma dessas condições falhar, o jogo inteiro continua funcionando

const SUPABASE_CONFIGURADO =

const supabaseClient = SUPABASE_CONFIGURADO

// Estado de sessão do jogador. usuario=null significa "modo convidado".
let sessao = { usuario: null, apelido: null, isAdmin: false };

// Roda no carregamento da página: o SDK do Supabase já guarda o token de
// sessão no localStorage por conta própria, então isto só recupera a sessão
// existente (se houver) sem exigir login de novo a cada visita.
async function verificarSessaoAtual() {
  if (!supabaseClient) return;
  try {
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session && data.session.user) {
      await carregarPerfilDaSessao(data.session.user);
    }
  } catch (e) {
    console.warn("[PatoVetZee] Não foi possível verificar a sessão de login:", e);
  }
}

async function carregarPerfilDaSessao(usuario) {
  sessao.usuario = usuario;
  let { data: perfil, error } = await supabaseClient
    .from("perfis")
    .select("apelido, is_admin")
    .eq("id", usuario.id)
    .maybeSingle();
  if (error) {
    // `is_admin` só existe depois da migração 002 — se a coluna ainda não
    // existe (banco antigo/migração não rodada), o select acima falha por
    // completo. Refaz só com `apelido` pra não perder a sessão por causa
    // disso; isAdmin fica false até a migração ser aplicada.
    console.warn("[PatoVetZee] Coluna is_admin indisponível (rode a migração 002?):", error.message);
    const fallback = await supabaseClient.from("perfis").select("apelido").eq("id", usuario.id).maybeSingle();
    perfil = fallback.data;
  }
  sessao.apelido = perfil ? perfil.apelido : null;
  sessao.isAdmin = !!(perfil && perfil.is_admin);
}

async function fazerLogout() {
  if (supabaseClient) await supabaseClient.auth.signOut();
  sessao = { usuario: null, apelido: null, isAdmin: false };
  renderIntro();
}

// Carrega a tabela `categorias` (migração 004, categorias criadas via o
// painel de admin DEPOIS das ~60 originais) e mistura em CATALOGO_PARAMETROS
// — sempre ADITIVO, nunca sobrescreve uma categoria já embutida com mesmo
// id. Roda ANTES de carregarBancoRemoto() (que valida as doenças contra
// CATALOGO_PARAMETROS): categorias precisam estar completas antes disso, ou
// doenças com a categoria nova pareceriam ter uma "chave desconhecida".
async function carregarCategoriasRemoto() {
  if (!supabaseClient) return false;
  try {
    const { data, error } = await supabaseClient.from("categorias").select("*");
    if (error) throw error;
    if (!data || data.length === 0) return false;

    let adicionou = false;
    data.forEach((cat) => {
      const alvo = cat.grupo === "binario" ? CATALOGO_PARAMETROS.binarios : CATALOGO_PARAMETROS.graduais;
      if (alvo[cat.id]) return; // já existe embutida — não sobrescreve
      alvo[cat.id] = { label: cat.label, grupo_tematico: cat.grupo_tematico };
      if (cat.grupo === "gradual" && cat.criterio_referencia) alvo[cat.id].criterio_referencia = cat.criterio_referencia;
      adicionou = true;
    });
    if (adicionou) console.log(`[PatoVetZee] Categorias extras carregadas do Supabase: ${data.length}.`);
    return adicionou;
  } catch (e) {
    console.warn("[PatoVetZee] Não foi possível carregar categorias extras (usando só as embutidas):", e.message || e);
    return false;
  }
}

// Carrega a tabela `doencas` do Supabase (migração 002) e, se der certo,
// substitui BANCO_DOENCAS/MAPA_DOENCAS pelo conteúdo remoto — é o que faz o
// painel de admin (seção 12) valer a pena: editar lá reflete no jogo pra
// todo mundo sem precisar de novo deploy. Best-effort: qualquer falha (sem
// Supabase configurado, tabela não migrada ainda, sem internet) simplesmente
// mantém BANCO_DOENCAS_EMBUTIDO — o jogo nunca fica sem conteúdo por causa
// disso.
async function carregarBancoRemoto() {
  if (!supabaseClient) return false;
  try {
    const { data, error } = await supabaseClient.from("doencas").select("*");
    if (error) throw error;
    if (!data || data.length === 0) return false;

    const banco = data.map((linha) => ({
      id: linha.id,
      nome: linha.nome,
      especie: linha.especie,
      sistema: linha.sistema,
      dica: linha.dica,
      parametros_binarios: linha.parametros_binarios || {},
      parametros_graduais: linha.parametros_graduais || {},
    }));
    const mapaCandidato = indexarBancoDoencas(banco);

    // Salvaguarda: nunca troca pro banco remoto se ele não tiver todas as
    // doenças que o desafio diário oficial (DESAFIO_DO_DIA, fixo no código)
    // referencia — isso quebraria o desafio da turma. Nesse caso, mantém o
    // banco embutido e só avisa no console.
    const faltando = DESAFIO_DO_DIA.doencas_selecionadas.filter((id) => !mapaCandidato[id]);
    if (faltando.length > 0) {
      console.warn(`[PatoVetZee] Banco remoto está sem doenças usadas no desafio diário oficial (${faltando.join(", ")}) — mantendo o banco embutido por segurança.`);
      return false;
    }

    BANCO_DOENCAS = banco;
    MAPA_DOENCAS = mapaCandidato;
    validarBancoDoencas();
    console.log(`[PatoVetZee] Banco de doenças carregado do Supabase: ${BANCO_DOENCAS.length} doenças.`);
    return true;
  } catch (e) {
    console.warn("[PatoVetZee] Não foi possível carregar o banco remoto (usando o conteúdo embutido):", e.message || e);
    return false;
  }
}

function traduzirErroAuth(error) {
  const msg = (error && error.message) || "Erro desconhecido.";
  if (/invalid login credentials/i.test(msg)) return "E-mail ou senha incorretos.";
  if (/already registered/i.test(msg)) return "Já existe uma conta com este e-mail — tente entrar em vez de criar conta.";
  if (/password should be at least/i.test(msg)) return "A senha precisa ter pelo menos 6 caracteres.";
  return msg;
}

// Envia o resultado de um desafio OFICIAL (não prática, não personalizado)
// para o Supabase, se o jogador estiver logado e já tiver apelido definido.
// Best-effort: roda em paralelo à gravação local (seção 9); se falhar (sem
// internet, projeto pausado, etc.) o jogo não quebra — o resultado
// continua salvo no localStorage do aparelho.
async function salvarResultadoRemoto(resultado) {
  if (!supabaseClient || !sessao.usuario || !sessao.apelido) return;
  if (estado.modoPratica || estado.desafio.personalizado) return;

  const { error } = await supabaseClient.from("resultados").upsert({
    user_id: sessao.usuario.id,
    desafio_id: estado.desafio.id,
    data_desafio: estado.desafio.data,
    total_score: resultado.totalScore,
    optimal_score: resultado.optimalScore,
    efficiency: resultado.efficiency,
  });

  if (error) {
    console.warn("[PatoVetZee] Não foi possível salvar o resultado no ranking (permanece salvo localmente):", error.message);
  }
}

// Registra QUALQUER partida completada (diário, sistema, duelo) na tabela
// `tentativas` (migração 003) — alimenta o painel do professor (seção 12).
// Nunca afeta o ranking público, que só olha pra `resultados`. Best-effort,
// igual salvarResultadoRemoto.
async function salvarTentativa(resultado, modo, modoDetalhe) {
  if (!supabaseClient || !sessao.usuario) return;
  const { error } = await supabaseClient.from("tentativas").insert({
    user_id: sessao.usuario.id,
    modo,
    modo_detalhe: modoDetalhe || null,
    desafio_id: estado.desafio.id,
    total_score: resultado.totalScore,
    optimal_score: resultado.optimalScore,
    efficiency: resultado.efficiency,
  });
  if (error) {
    console.warn("[PatoVetZee] Não foi possível registrar a tentativa para o painel do professor:", error.message);
  }
}

const ABAS_RANKING = [
  { id: "diario", label: "Diário", tabela: "ranking_diario" },

];

function inicioSemanaISO(data) {
  const d = new Date(Date.UTC(data.getFullYear(), data.getMonth(), data.getDate()));
  const diaISO = (d.getUTCDay() + 6) % 7; // 0 = segunda-feira
  d.setUTCDate(d.getUTCDate() - diaISO);
  return d.toISOString().slice(0, 10);
}
function inicioMesISO(data) {
  return `${data.getFullYear()}-${String(data.getMonth() + 1).padStart(2, "0")}-01`;
}

async function renderRanking(abaSelecionada) {
  abaSelecionada = abaSelecionada || "diario";
  limparApp();
  appEl.appendChild(renderMarca());

  if (!SUPABASE_CONFIGURADO) {
    appEl.appendChild(el("section", { class: "card" }, [

      el("button", { class: "btn secundario", text: "⬅ Voltar", onclick: renderIntro }),
    ]));
    return;
  }

  const infoAba = ABAS_RANKING.find((a) => a.id === abaSelecionada);
  const abas = el("div", { class: "abas-ranking", role: "tablist" },
    ABAS_RANKING.map((a) => el("button", {
      class: "aba-ranking" + (a.id === abaSelecionada ? " ativa" : ""),
      type: "button",
      role: "tab",
      "aria-selected": String(a.id === abaSelecionada),
      onclick: () => renderRanking(a.id),
      text: a.label,
    }))
  );

  const cardRanking = el("section", { class: "card" }, [
    el("h2", { text: "Ranking — " + infoAba.label }),
  ]);
  cardRanking.appendChild(abas);
  const carregandoEl = el("p", { text: "Carregando..." });
  cardRanking.appendChild(carregandoEl);
  appEl.appendChild(cardRanking);

  appEl.appendChild(el("section", { class: "card", style: "text-align:center" }, [
    el("button", { class: "btn secundario", text: "⬅ Voltar", onclick: renderIntro }),
  ]));

  let query = supabaseClient.from(infoAba.tabela).select("*");
  if (abaSelecionada === "diario") query = query.eq("desafio_id", DESAFIO_DO_DIA.id);
  else if (abaSelecionada === "semanal") query = query.eq("inicio_semana", inicioSemanaISO(new Date()));
  else if (abaSelecionada === "mensal") query = query.eq("inicio_mes", inicioMesISO(new Date()));
  query = query.order("posicao", { ascending: true }).limit(50);

  const { data, error } = await query;
  carregandoEl.remove();

  if (error) {
    cardRanking.appendChild(el("p", { class: "campo-erro", text: "Não foi possível carregar o ranking: " + error.message }));
    return;
  }
  if (!data || data.length === 0) {
    cardRanking.appendChild(el("p", { text: "Ainda não há resultados suficientes para montar este ranking." }));
    return;
  }

  const medalhas = ["🥇", "🥈", "🥉"];
  const tabela = el("table", { class: "tabela-ranking" }, [
    el("thead", {}, [el("tr", {}, [
      el("th", { text: "#" }),
      el("th", { text: "Apelido" }),
      el("th", { text: abaSelecionada === "diario" ? "Pontos" : "Pontos no período" }),
      ...(abaSelecionada !== "diario" ? [el("th", { text: "Desafios" })] : []),
    ])]),
  ]);
  const corpo = el("tbody");
  data.forEach((linha, i) => {
    const ehMinhaLinha = !!(sessao.apelido && linha.apelido === sessao.apelido);
    const celulas = [
      el("td", { text: (medalhas[i] || "") + (i + 1) }),
      el("td", { text: linha.apelido }),
      el("td", { text: String(abaSelecionada === "diario" ? linha.total_score : linha.pontos_periodo) }),
    ];
    if (abaSelecionada !== "diario") celulas.push(el("td", { text: String(linha.desafios_jogados) }));
    corpo.appendChild(el("tr", { class: ehMinhaLinha ? "minha-linha" : "" }, celulas));
  });
  tabela.appendChild(corpo);
  cardRanking.appendChild(tabela);
}


/* =========================================================================
 * 11. MODO POR SISTEMAS
 * -------------------------------------------------------------------------
 * Modo de ESTUDO (não o desafio diário oficial): o jogador escolhe um
 * sistema (ex.: "Digestório") e o jogo monta, na hora, um desafio só com as
 * doenças daquele sistema — quantas houver no banco — e escolhe
 * automaticamente categorias com boa variação entre elas (ver
 * `escolherCategoriasAutomaticamente`, seção 5). Não precisa de curadoria
 * manual por sistema; conforme o banco crescer, os desafios ficam maiores
 * sozinhos.
 *
 * Roda sempre em modo prática: não conta para o "já jogou hoje" nem entra
 * no ranking (mesma lógica que já protege o modo prática do desafio
 * diário — ver `salvarResultado`/`salvarResultadoRemoto`, seção 9-10).
 * ======================================================================= */

// Sistemas com poucas doenças cadastradas geram um "desafio" trivial demais
// (ex.: 1 doença x 1 categoria não é puzzle nenhum). Esse mínimo é só um
// limiar de exibição — sobe naturalmente conforme você cadastra mais
// doenças em cada sistema.
const MIN_DOENCAS_MODO_SISTEMA = 3;

function contarDoencasPorSistema() {
  const contagem = {};
  for (const id of Object.keys(CATALOGO_SISTEMAS)) contagem[id] = 0;
  for (const doenca of BANCO_DOENCAS) {
    if (doenca.sistema in contagem) contagem[doenca.sistema]++;
  }
  return contagem;
}

function renderEscolherSistema() {
  limparApp();
  appEl.appendChild(renderMarca());

  const contagem = contarDoencasPorSistema();
  const card = el("section", { class: "card" }, [
    el("h2", { text: "Modo por sistemas" }),
    el("p", { text:
      "Escolha um sistema para praticar só com as doenças daquele grupo. É um modo de " +
      "estudo — não conta para o desafio diário nem para o ranking." }),
  ]);

  Object.entries(CATALOGO_SISTEMAS).forEach(([sistemaId, label]) => {
    const n = contagem[sistemaId];
    const habilitado = n >= MIN_DOENCAS_MODO_SISTEMA;
    card.appendChild(el("button", {
      class: "item-sistema",
      style: habilitado ? "" : "opacity:0.55; cursor:not-allowed;",
      type: "button",
      disabled: !habilitado,
      onclick: habilitado ? () => iniciarDesafioPorSistema(sistemaId) : undefined,
    }, [
      el("span", { text:
        habilitado
          ? `${label} (${n} doenças)`
          : `${label} — em construção (${n}/${MIN_DOENCAS_MODO_SISTEMA} doenças)` }),
    ]));
  });

  card.appendChild(el("button", { class: "btn secundario", text: "⬅ Voltar", onclick: renderIntro }));
  appEl.appendChild(card);
}

// Tamanho de cada rodada do Modo por Sistemas — mantém o mesmo formato 9x9
// do desafio diário mesmo em sistemas com bancos grandes (ex.: Tegumentar
// tem 31 doenças hoje). Quando o sistema tem mais que isso, sorteia um
// subconjunto novo a cada partida (sem seed fixa — é modo prática).
const RODADA_TAMANHO_SISTEMA = 9;

function iniciarDesafioPorSistema(sistemaId) {
  const todasDoencaIds = BANCO_DOENCAS.filter((d) => d.sistema === sistemaId).map((d) => d.id);
  const doencaIds = todasDoencaIds.length > RODADA_TAMANHO_SISTEMA
    ? embaralharComSeed(todasDoencaIds, "sistema-" + sistemaId + "|sorteio|" + Date.now()).slice(0, RODADA_TAMANHO_SISTEMA)
    : todasDoencaIds;
  const quantidade = doencaIds.length;
  const parametrosSelecionados = escolherCategoriasAutomaticamente(doencaIds, quantidade);

  const desafio = {
    id: "sistema-" + sistemaId,
    data: null,
    titulo: `Modo por sistemas — ${CATALOGO_SISTEMAS[sistemaId]}`,
    personalizado: true, // reaproveita a mesma lógica de "não salva no ranking oficial"
    doencas_selecionadas: doencaIds,
    parametros_selecionados: parametrosSelecionados,
    explicacoes: {}, // sem curadoria manual — cai no fallback de explicação automática
  };

  iniciarPartida(desafio, { pratica: true });
  renderDoencaAtual();
}


/* =========================================================================
 * 12. ADMINISTRAÇÃO DO BANCO DE DOENÇAS (só pra sessao.isAdmin === true)
 * -------------------------------------------------------------------------
 * CRUD completo contra a tabela `doencas` do Supabase (ver
 * supabase_migration_002_doencas.sql). Toda escrita passa pela RLS
 * "só admin" do lado do banco — mesmo que alguém adultere o JS no
 * navegador, o Supabase recusa a escrita se a conta não tiver
 * is_admin=true. Depois de cada escrita bem-sucedida, atualiza
 * BANCO_DOENCAS/MAPA_DOENCAS localmente também, sem esperar um reload.
 * ======================================================================= */

const NOMES_GRUPO_TEMATICO = {
  etiologia: "Etiologia",
  transmissao: "Transmissão",
  predisposicao: "Predisposição",
  natureza_lesao: "Natureza da lesão",

  tratamento: "Tratamento",
  prognostico: "Prognóstico",
};
const ORDEM_GRUPOS_TEMATICOS = Object.keys(NOMES_GRUPO_TEMATICO);

// Filtros da lista ficam num objeto de módulo (não em `estado`, que é só do
// jogo em andamento) pra sobreviver entre re-renders enquanto o admin digita
// na busca.
let estadoAdmin = { busca: "", sistema: "", especie: "" };

function guardaFoco(idCampo) {
  const ativo = document.activeElement;
  if (!ativo || ativo.id !== idCampo) return null;
  return { id: idCampo, selecaoInicio: ativo.selectionStart, selecaoFim: ativo.selectionEnd };
}
function restauraFoco(guardado) {
  if (!guardado) return;
  const campo = document.getElementById(guardado.id);
  if (!campo) return;
  campo.focus();
  if (typeof campo.setSelectionRange === "function" && guardado.selecaoInicio != null) {
    try { campo.setSelectionRange(guardado.selecaoInicio, guardado.selecaoFim); } catch (e) { /* tipo de input sem seleção de texto */ }
  }
}

  const linhaSelects = document.createElement("div");

  const filtroSistema = document.createElement("select");

  const especiesConhecidas = [...new Set(BANCO_DOENCAS.map((d) => d.especie))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  const filtroEspecie = document.createElement("select");
  filtroEspecie.className = "campo";
  filtroEspecie.style.flex = "1"; filtroEspecie.style.minWidth = "160px";
