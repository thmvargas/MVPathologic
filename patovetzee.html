<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PatoVetZee — Desafio diário de patologia veterinária</title>
<meta name="description" content="Jogo diário de alocação: encaixe 9 doenças em 9 categorias clínicas, em ordem, sem voltar atrás.">
<!--
  Tenta carregar uma fonte arredondada e amigável do Google Fonts. Se não
  houver internet (ex.: uso 100% offline por file://), o @import simplesmente
  falha silenciosamente e a pilha de fallback (também arredondada/amigável)
  do CSS abaixo assume — o jogo funciona igual, só muda a fonte.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');

:root{
  --cor-fundo-1:#FFF1D6;
  --cor-fundo-2:#FFD9E8;
  --cor-primaria:#FF6B6B;
  --cor-primaria-escura:#E8534F;
  --cor-secundaria:#4ECDC4;
  --cor-secundaria-escura:#33A79F;
  --cor-acento:#C77DFF;
  --cor-sucesso:#2FBF71;
  --cor-alerta:#FFB800;
  --cor-texto:#3A2E39;
  --cor-texto-suave:#6b5f6a;
  --cor-card:#FFFFFF;
  --cor-card-borda:#3A2E39;
  --raio:22px;
  --raio-pequeno:14px;
  --sombra-sticker:0 6px 0 rgba(58,46,57,0.18), 0 10px 20px rgba(58,46,57,0.12);
  --sombra-sticker-pequena:0 4px 0 rgba(58,46,57,0.18), 0 6px 14px rgba(58,46,57,0.10);
  --fonte: 'Baloo 2', 'Comic Sans MS', 'Segoe UI Rounded', 'Trebuchet MS', Verdana, sans-serif;
  color-scheme: light;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  min-height:100%;
  font-family: var(--fonte);
  color: var(--cor-texto);
  background: radial-gradient(circle at 15% 10%, var(--cor-fundo-2), transparent 55%),
              radial-gradient(circle at 85% 90%, var(--cor-secundaria), transparent 45%),
              linear-gradient(160deg, var(--cor-fundo-1), var(--cor-fundo-2));
  background-attachment: fixed;
  overflow-x:hidden;
}

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

#app{
  max-width: 760px;
  margin: 0 auto;
  padding: 20px 16px 64px;
}

/* --------- Cabeçalho / marca --------- */
.marca{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin: 4px 0 18px;
}
.marca h1{
  font-size: clamp(28px, 6vw, 40px);
  margin:0;
  letter-spacing: 0.5px;
  color: var(--cor-primaria-escura);
  text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
}
.marca .mascote{ width:68px; height:52px; flex-shrink:0; }

/* --------- Cards genéricos "sticker" --------- */
.card{
  background: var(--cor-card);
  border: 3px solid var(--cor-card-borda);
  border-radius: var(--raio);
  box-shadow: var(--sombra-sticker);
  padding: 22px;
  margin-bottom: 18px;
}
.card h2{ margin-top:0; }

/* --------- Botões --------- */
.btn{
  font-family: inherit;
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  background: var(--cor-primaria);
  border: 3px solid var(--cor-card-borda);
  border-radius: 999px;
  padding: 14px 26px;
  min-height: 48px;
  min-width: 44px;
  cursor: pointer;
  box-shadow: var(--sombra-sticker-pequena);
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
  touch-action: manipulation;
}
.btn:hover{ filter: brightness(1.05); }
.btn:active{ transform: translateY(3px) scale(0.97); box-shadow: 0 1px 0 rgba(58,46,57,0.18); }
.btn:focus-visible{ outline: 3px solid var(--cor-acento); outline-offset: 3px; }
.btn.secundario{ background: var(--cor-secundaria); }
.btn.acento{ background: var(--cor-acento); }
.btn.fantasma{
  background: #fff; color: var(--cor-texto);
}
.btn:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }

.btn-categoria{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  text-align:left;
  font-size:16px;
  font-weight:700;
  font-family:inherit;
  color: var(--cor-texto);
  border:3px solid var(--cor-card-borda);
  border-radius: 20px;
  padding: 14px 18px;
  min-height:52px;
  margin-bottom:12px;
  box-shadow: var(--sombra-sticker-pequena);
  cursor:pointer;
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, filter 0.15s;
}
.btn-categoria:hover{ filter: brightness(1.07); transform: translateY(-2px); }
.btn-categoria:active{ transform: translateY(3px); box-shadow:0 1px 0 rgba(58,46,57,0.18); filter:none; }
.btn-categoria:focus-visible{ outline: 3px solid var(--cor-card-borda); outline-offset:2px; }

/* Paleta cíclica pastel-vibrante — cada botão de categoria pega uma cor da
   roda, na ordem em que aparece, pra tela não ficar toda branca/monótona. */
.btn-categoria.cor-1{ background: #FFB4B4; }
.btn-categoria.cor-2{ background: #FFE29A; }
.btn-categoria.cor-3{ background: #B8F2E6; }
.btn-categoria.cor-4{ background: #AEDFF7; }
.btn-categoria.cor-5{ background: #D9C6F2; }
.btn-categoria.cor-6{ background: #FFCBE1; }

.btn-categoria .texto-categoria{ flex:1; }

.btn-categoria.confirmando{
  background: var(--cor-sucesso) !important;
  color:#fff;
  pointer-events:none;
}
.btn-categoria .check{
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  background: #fff; color: var(--cor-sucesso); font-weight:800;
  opacity:0; transform: scale(0.4);
  transition: opacity 0.2s, transform 0.25s cubic-bezier(.34,1.56,.64,1);
}
.btn-categoria.confirmando .check{ opacity:1; transform: scale(1); }

.grade-categorias{
  display:grid;
  grid-template-columns: 1fr;
  gap:0;
}
@media (min-width:520px){
  .grade-categorias{ grid-template-columns: 1fr 1fr; gap:0 12px; }
}

/* --------- Roteiro (sequência de doenças do dia) --------- */
.lista-roteiro{
  list-style:none; margin:0; padding:0;
  display:flex; flex-direction:column; gap:6px;
}
.item-roteiro{
  padding:9px 14px;
  border-radius:14px;
  font-size:14px;
  border:2px solid transparent;
}
.item-roteiro.futura{ background:#FFF6E9; color: var(--cor-texto); }
.item-roteiro.atual{
  background: var(--cor-alerta); color:#3A2E39; font-weight:800;
  border-color: var(--cor-card-borda);
}
.item-roteiro.feita{ background:transparent; color: var(--cor-texto-suave); text-decoration: line-through; }

/* --------- Selo de pontuação (revelado após cada escolha) --------- */
.badge-pontuacao{
  display:inline-block;
  font-size: clamp(28px, 7vw, 40px);
  font-weight:800;
  padding: 8px 26px;
  border-radius: 999px;
  border: 3px solid var(--cor-card-borda);
  margin: 12px 0 6px;
}
.badge-pontuacao.cheio{ background:#E9FBF2; color: var(--cor-sucesso); }
.badge-pontuacao.vazio{ background:#FFF1E9; color: var(--cor-texto-suave); }
.texto-explicacao{ font-size:15px; color: var(--cor-texto-suave); max-width:480px; margin:6px auto 0; }

/* --------- Doença atual (carta) --------- */
.carta-doenca{
  text-align:center;
  padding: 30px 20px;
  background: linear-gradient(135deg,#fff, #FFF6E9);
}
.carta-doenca .rotulo-passo{
  display:inline-block;
  background: var(--cor-secundaria);
  color:#fff; font-weight:700;
  border-radius: 999px; padding: 4px 14px; margin-bottom:10px;
  border: 2px solid var(--cor-card-borda);
}
.carta-doenca h2{
  font-size: clamp(22px, 6vw, 30px);
  margin: 8px 0 4px;
}
.carta-doenca .aviso-irreversivel{
  font-size:13px; color: var(--cor-texto-suave); margin-top:6px;
}
.icone-doenca{ width:72px; height:72px; margin:0 auto 8px; }

@keyframes cartaEntra{
  0%{ opacity:0; transform: translateY(24px) rotate(-3deg) scale(0.9); }
  60%{ opacity:1; transform: translateY(-4px) rotate(1deg) scale(1.02); }
  100%{ opacity:1; transform: translateY(0) rotate(0) scale(1); }
}
.carta-doenca.anim-entrada{ animation: cartaEntra 0.55s ease-out; }

/* --------- Barra de progresso --------- */
.progresso{
  display:flex; gap:6px; justify-content:center; margin-bottom:14px;
}
.progresso .ponto{
  width:14px; height:14px; border-radius:50%;
  background:#fff; border:2px solid var(--cor-card-borda);
}
.progresso .ponto.feito{ background: var(--cor-sucesso); }
.progresso .ponto.atual{ background: var(--cor-alerta); }

/* --------- Resultado --------- */
.resumo-total{
  text-align:center; padding: 18px;
}
.resumo-total .numero-grande{
  font-size: clamp(40px,10vw,64px); font-weight:800; color: var(--cor-primaria-escura);
  line-height:1;
}
.barra-eficiencia{
  height: 22px; border-radius: 999px; background:#eee; border:2px solid var(--cor-card-borda);
  overflow:hidden; margin: 10px 0;
}
.barra-eficiencia .preenchimento{
  height:100%; background: linear-gradient(90deg, var(--cor-secundaria), var(--cor-sucesso));
  width:0%; transition: width 1s ease-out;
}

.linha-par{
  display:flex; justify-content:space-between; gap:10px;
  padding:10px 0; border-bottom: 2px dashed #eadfe0;
  opacity:0; transform: translateY(10px);
  animation: parEntra 0.4s ease-out forwards;
}
@keyframes parEntra{ to{ opacity:1; transform:none; } }
.linha-par:last-child{ border-bottom:none; }
.linha-par .pontos{ font-weight:800; white-space:nowrap; }
.linha-par .pontos.cheio{ color: var(--cor-sucesso); }
.linha-par .pontos.vazio{ color: var(--cor-texto-suave); }
.linha-par .explicacao{ font-size:14px; color: var(--cor-texto-suave); margin-top:2px; }

.tabela-otima{ width:100%; border-collapse: collapse; font-size:14px; }
.tabela-otima th, .tabela-otima td{ text-align:left; padding:6px 8px; border-bottom:1px solid #eee; }

/* --------- Confete --------- */
#confetti-layer{
  position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;
}
.confete{
  position:absolute; top:-20px; width:10px; height:16px;
  animation-name: cair; animation-timing-function: linear; animation-fill-mode: forwards;
  border-radius:3px;
}
@keyframes cair{
  0%{ transform: translateY(0) rotate(0deg); opacity:1; }
  100%{ transform: translateY(110vh) rotate(var(--rot,360deg)); opacity:0.9; }
}

/* --------- Modal desafio personalizado --------- */
.modal-fundo{
  position:fixed; inset:0; background: rgba(58,46,57,0.55);
  display:flex; align-items:center; justify-content:center; padding:16px; z-index:1000;
}
.modal-caixa{
  background:#fff; border-radius: var(--raio); border:3px solid var(--cor-card-borda);
  max-width:560px; width:100%; max-height:88vh; overflow:auto; padding:22px;
  box-shadow: var(--sombra-sticker);
}
.modal-caixa textarea{
  width:100%; min-height:160px; font-family: monospace; font-size:13px;
  border-radius: var(--raio-pequeno); border:2px solid #ccc; padding:10px;
}
.campo-erro{ color:#B00020; font-size:14px; white-space:pre-wrap; }

.rodape-nota{ text-align:center; font-size:12px; color: var(--cor-texto-suave); margin-top:24px; }

/* --------- Login / sessão / ranking --------- */
.campo{
  width:100%; font-family:inherit; font-size:16px;
  border:2px solid #ccc; border-radius: var(--raio-pequeno);
  padding:12px 14px; margin-bottom:12px; min-height:44px;
}
.campo:focus{ outline:3px solid var(--cor-acento); outline-offset:1px; border-color: var(--cor-acento); }
.rotulo-campo{ display:block; font-weight:700; margin-bottom:6px; }
.faixa-sessao{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#fff; border:3px solid var(--cor-card-borda); border-radius: var(--raio-pequeno);
  padding:10px 16px; margin-bottom:16px; flex-wrap:wrap;
}
.faixa-sessao strong{ color: var(--cor-primaria-escura); }
.aviso-config{
  background:#FFF3CD; border:2px dashed #B08900; color:#6b5400;
  border-radius: var(--raio-pequeno); padding:12px 16px; font-size:14px;
}
.abas-ranking{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.aba-ranking{
  font-family:inherit; font-weight:700; font-size:14px;
  border:3px solid var(--cor-card-borda); border-radius:999px;
  padding:8px 18px; min-height:44px; background:#fff; cursor:pointer;
  box-shadow: var(--sombra-sticker-pequena);
}
.aba-ranking.ativa{ background: var(--cor-secundaria); color:#fff; }
.tabela-ranking{ width:100%; border-collapse:collapse; font-size:15px; }
.tabela-ranking th, .tabela-ranking td{ text-align:left; padding:8px 10px; border-bottom:1px solid #eee; }
.tabela-ranking tr.minha-linha{ background:#FFF3CD; font-weight:800; }
.medalha{ font-size:18px; margin-right:4px; }

@media (max-width:420px){
  .card{ padding:16px; }
}
</style>
</head>
<body>
<div id="app" role="main" aria-live="off"></div>
<div id="confetti-layer" aria-hidden="true"></div>
<div id="live-region" class="sr-only" role="status" aria-live="polite"></div>

<!--
  SDK do Supabase — só é usado para login e ranking (seção 10 do script
  abaixo). Se isto não carregar (sem internet, CDN bloqueado, etc.), o jogo
  inteiro continua funcionando normalmente em modo "sem login" — só login e
  ranking ficam indisponíveis, com um aviso claro na tela em vez de quebrar.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
"use strict";

/* =========================================================================
 * PatoVetZee — motor do jogo
 * -------------------------------------------------------------------------
 * Arquivo único, sem dependências externas obrigatórias, pensado para rodar
 * via file:// ou hospedagem estática simples.
 *
 * Organização (conforme pedido no briefing):
 *   1. Banco de doenças com parâmetros
 *   2. Definição do desafio do dia
 *   3. Utilitário de seed determinístico por data
 *   4. Algoritmo húngaro + testes internos
 *   5. Estado do jogo
 *   6. Renderização / DOM e animações
 *   7. Handlers de interação (clique/toque + teclado)
 *   8. Cálculo e exibição do resultado final
 *   9. Persistência local (localStorage)
 * ======================================================================= */


/* =========================================================================
 * 1. BANCO DE DOENÇAS COM PARÂMETROS
 * -------------------------------------------------------------------------
 * Por que este formato (e não uma matriz 9x9 por desafio):
 *   - O banco é a fonte de verdade clínica. Cada doença já carrega TODOS os
 *     parâmetros que possui (binários + graduais) de uma vez.
 *   - A pontuação de qualquer par doença×categoria nunca é armazenada — ela
 *     é sempre derivada em tempo real a partir daqui (ver calcularPontuacao,
 *     seção 5). Isso elimina a necessidade de preencher uma matriz nova a
 *     cada desafio.
 *   - Quando novas doenças forem adicionadas, basta acrescentar um objeto
 *     aqui com os mesmos ~60 campos preenchidos; elas já ficam disponíveis
 *     para entrar em qualquer desafio futuro.
 * ======================================================================= */

// Catálogo de metadados dos parâmetros (não é por doença — é a "régua").
// grupo_tematico é só organizacional (facilita você navegar/editar).
const CATALOGO_PARAMETROS = {
  binarios: {
    // --- Etiologia ---
    zoonose: { label: "Zoonose", grupo_tematico: "etiologia" },
    doenca_viral: { label: "Doença viral", grupo_tematico: "etiologia" },
    doenca_bacteriana: { label: "Doença bacteriana", grupo_tematico: "etiologia" },
    doenca_parasitaria: { label: "Doença parasitária", grupo_tematico: "etiologia" },
    doenca_fungica: { label: "Doença fúngica", grupo_tematico: "etiologia" },
    associada_uso_hormonios: { label: "Associada ao uso de hormônios", grupo_tematico: "etiologia" },
    etiologia_hereditaria_genetica: { label: "Etiologia hereditária/genética", grupo_tematico: "etiologia" },

    // --- Transmissão ---
    transmitida_por_vetores: { label: "Transmitida por vetores", grupo_tematico: "transmissao" },
    contagiosa_contato_direto: { label: "Contagiosa por contato direto", grupo_tematico: "transmissao" },
    transmissao_ambiental_fomites: { label: "Transmissão ambiental/fômites relevante", grupo_tematico: "transmissao" },
    transmissao_vertical_transplacentaria: { label: "Transmissão vertical/transplacentária possível", grupo_tematico: "transmissao" },
    requer_notificacao_obrigatoria: { label: "Doença de notificação obrigatória", grupo_tematico: "transmissao" },

    // --- Predisposição ---
    maior_prevalencia_felinos: { label: "Maior prevalência em felinos", grupo_tematico: "predisposicao" },
    predisposicao_racial_reconhecida: { label: "Predisposição racial reconhecida", grupo_tematico: "predisposicao" },
    maior_prevalencia_animais_idosos: { label: "Maior prevalência em animais idosos", grupo_tematico: "predisposicao" },
    maior_prevalencia_filhotes_jovens: { label: "Maior prevalência em filhotes/jovens", grupo_tematico: "predisposicao" },
    predisposicao_femeas_nao_castradas: { label: "Predisposição em fêmeas não castradas", grupo_tematico: "predisposicao" },
    associada_obesidade: { label: "Associada à obesidade", grupo_tematico: "predisposicao" },
    maior_prevalencia_ambientes_coletivos: { label: "Maior prevalência em ambientes coletivos", grupo_tematico: "predisposicao" },

    // --- Natureza da lesão ---
    doenca_neoplasica: { label: "Doença neoplásica", grupo_tematico: "natureza_lesao" },
    causa_hemorragia: { label: "Causa hemorragia", grupo_tematico: "natureza_lesao" },
    lesao_caracteristicamente_multissistemica: { label: "Lesão caracteristicamente multissistêmica", grupo_tematico: "natureza_lesao" },
    processo_inflamatorio_predominante: { label: "Processo inflamatório predominante", grupo_tematico: "natureza_lesao" },
    lesao_potencialmente_metastatica: { label: "Lesão potencialmente metastática/invasiva", grupo_tematico: "natureza_lesao" },
    causa_alteracao_degenerativa_cronica: { label: "Causa alteração degenerativa crônica", grupo_tematico: "natureza_lesao" },

    // --- Sinais clínicos ---
    sinais_gastrointestinais_proeminentes: { label: "Sinais gastrointestinais proeminentes", grupo_tematico: "sinais_clinicos" },
    sinais_respiratorios_proeminentes: { label: "Sinais respiratórios proeminentes", grupo_tematico: "sinais_clinicos" },
    sinais_dermatologicos_proeminentes: { label: "Sinais dermatológicos proeminentes", grupo_tematico: "sinais_clinicos" },
    sinais_musculoesqueleticos_proeminentes: { label: "Sinais musculoesqueléticos proeminentes", grupo_tematico: "sinais_clinicos" },
    linfonodomegalia_frequente: { label: "Linfonodomegalia frequente", grupo_tematico: "sinais_clinicos" },
    febre_frequente: { label: "Febre frequente", grupo_tematico: "sinais_clinicos" },
    sinais_sistemicos_inespecificos_comuns: { label: "Sinais sistêmicos inespecíficos comuns", grupo_tematico: "sinais_clinicos" },
    perda_peso_ou_caquexia_frequente: { label: "Perda de peso/caquexia frequente", grupo_tematico: "sinais_clinicos" },

    // --- Diagnóstico ---
    diagnostico_por_exame_sorologico: { label: "Diagnóstico auxiliado por sorologia", grupo_tematico: "diagnostico" },
    diagnostico_por_citologia_biopsia: { label: "Diagnóstico via citologia/biópsia", grupo_tematico: "diagnostico" },
    diagnostico_por_imagem_essencial: { label: "Diagnóstico com uso essencial de imagem", grupo_tematico: "diagnostico" },
    diagnostico_laboratorial_bioquimico_essencial: { label: "Bioquímica/hematologia essencial ao Dx", grupo_tematico: "diagnostico" },
    diagnostico_definitivo_requer_histopatologia: { label: "Diagnóstico definitivo requer histopatologia", grupo_tematico: "diagnostico" },
    teste_rapido_disponivel_rotina: { label: "Teste rápido disponível na rotina", grupo_tematico: "diagnostico" },
    alteracoes_hematologicas_caracteristicas: { label: "Alterações hematológicas características", grupo_tematico: "diagnostico" },

    // --- Tratamento ---
    tratamento_cirurgico_indicado: { label: "Tratamento cirúrgico indicado", grupo_tematico: "tratamento" },
    tratamento_quimioterapico_indicado: { label: "Tratamento quimioterápico indicado", grupo_tematico: "tratamento" },
    tratamento_com_antimicrobianos_especificos: { label: "Tratamento com agente específico (anti-inf.)", grupo_tematico: "tratamento" },
    tratamento_essencialmente_de_suporte: { label: "Tratamento essencialmente de suporte", grupo_tematico: "tratamento" },
    tratamento_topico_frequente: { label: "Tratamento tópico frequente", grupo_tematico: "tratamento" },

const MAPA_DOENCAS = Object.fromEntries(BANCO_DOENCAS.map((d) => [d.id, d]));

// Checagem de integridade do banco: roda uma vez ao carregar a página e avisa
// no console (não trava o jogo) se alguma doença estiver com parâmetro
// faltando, com tipo errado, ou com uma chave que não existe no catálogo
// (sinal comum de erro de digitação ao copiar o MODELO_NOVA_DOENCA.js).
// Ver GUIA_MANUTENCAO.md para o passo a passo de como adicionar doenças.
function validarBancoDoencas() {
  const idsBinarios = Object.keys(CATALOGO_PARAMETROS.binarios);
  const idsGraduais = Object.keys(CATALOGO_PARAMETROS.graduais);
  let problemas = 0;

  for (const doenca of BANCO_DOENCAS) {
    const faltando = [];
    const tipoErrado = [];
    const desconhecidos = [];

    for (const id of idsBinarios) {
      if (!(id in (doenca.parametros_binarios || {}))) faltando.push(id);
      else if (typeof doenca.parametros_binarios[id] !== "boolean") tipoErrado.push(id);
    }
    for (const id of Object.keys(doenca.parametros_binarios || {})) {
      if (!idsBinarios.includes(id)) desconhecidos.push("binario:" + id);
    }

    for (const id of idsGraduais) {
      if (!(id in (doenca.parametros_graduais || {}))) faltando.push(id);
      else if (typeof doenca.parametros_graduais[id] !== "number" || doenca.parametros_graduais[id] < 0 || doenca.parametros_graduais[id] > 100) {
        tipoErrado.push(id + " (deve ser número entre 0 e 100)");
      }
    }
    for (const id of Object.keys(doenca.parametros_graduais || {})) {
      if (!idsGraduais.includes(id)) desconhecidos.push("gradual:" + id);
    }

    if (faltando.length || tipoErrado.length || desconhecidos.length) {
      problemas++;
      console.warn(
        `[PatoVetZee] Doença "${doenca.id}" (${doenca.nome}) tem problemas no banco de dados:` +
        (faltando.length ? `\n  faltando: ${faltando.join(", ")}` : "") +
        (tipoErrado.length ? `\n  valor com tipo/faixa inválidos: ${tipoErrado.join(", ")}` : "") +
        (desconhecidos.length ? `\n  chave desconhecida (possível erro de digitação): ${desconhecidos.join(", ")}` : "")
      );
    }
  }

  // Ids de doença duplicados também quebram o jogo (MAPA_DOENCAS silenciosamente
  // sobrescreve o anterior), então vale avisar.
  const contagem = {};
  BANCO_DOENCAS.forEach((d) => { contagem[d.id] = (contagem[d.id] || 0) + 1; });
  const duplicados = Object.entries(contagem).filter(([, n]) => n > 1).map(([id]) => id);
  if (duplicados.length) {
    problemas++;
    console.warn(`[PatoVetZee] Ids de doença duplicados no BANCO_DOENCAS: ${duplicados.join(", ")}`);
  }

  if (problemas === 0) {
    console.log(`[PatoVetZee] Banco de doenças OK: ${BANCO_DOENCAS.length} doenças, todos os ${idsBinarios.length + idsGraduais.length} parâmetros presentes e válidos.`);
  }
  return problemas === 0;
}

/* =========================================================================
 * 3. UTILITÁRIO DE SEED DETERMINÍSTICO POR DATA
 * ======================================================================= */

// Hash simples de string -> inteiro 32-bit (variante djb2/xfnv1a), só para
// transformar uma data (ou qualquer string) numa seed numérica estável.
function hashStringParaSeed(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

// PRNG determinístico (mulberry32) — mesmo seed sempre gera a mesma
// sequência de números em [0,1).
function criarGeradorPseudoAleatorio(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Embaralha `array` de forma determinística a partir de `seedTexto`
// (Fisher-Yates). Não modifica o array original.
function embaralharComSeed(array, seedTexto) {
  const rand = criarGeradorPseudoAleatorio(hashStringParaSeed(seedTexto));
  const copia = array.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

 * Adaptado para MAXIMIZAÇÃO (minimizamos o custo = -pontuação). Testado
 * isoladamente antes de integrar (ver hungarian.js na mesma pasta para a
 * versão executável via `node hungarian.js`).
 * ======================================================================= */

function hungarianMinCost(costMatrix) {
  const n = costMatrix.length;
  const INF = Infinity;
  const u = new Array(n + 1).fill(0);
  const v = new Array(n + 1).fill(0);
  const p = new Array(n + 1).fill(0);
  const way = new Array(n + 1).fill(0);

  for (let i = 1; i <= n; i++) {
    p[0] = i;
    let j0 = 0;
    const minv = new Array(n + 1).fill(INF);
    const used = new Array(n + 1).fill(false);
    do {
      used[j0] = true;
      const i0 = p[j0];
      let delta = INF;
      let j1 = -1;
      for (let j = 1; j <= n; j++) {
        if (!used[j]) {
          const cur = costMatrix[i0 - 1][j - 1] - u[i0] - v[j];
          if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
          if (minv[j] < delta) { delta = minv[j]; j1 = j; }
        }
      }
      for (let j = 0; j <= n; j++) {
        if (used[j]) { u[p[j]] += delta; v[j] -= delta; }
        else { minv[j] -= delta; }
      }
      j0 = j1;
    } while (p[j0] !== 0);
    do {
      const j1 = way[j0];
      p[j0] = p[j1];
      j0 = j1;
    } while (j0 !== 0);
  }

  const assignment = new Array(n);
  for (let j = 1; j <= n; j++) if (p[j] > 0) assignment[p[j] - 1] = j - 1;
  const totalCost = assignment.reduce((s, col, row) => s + costMatrix[row][col], 0);
  return { assignment, totalCost, u, v };
}

// API pública: recebe scoreMatrix[doenca][categoria] (0-100 ou qualquer
// número) e devolve a alocação que MAXIMIZA a soma.
function hungarianMaxAssignment(scoreMatrix) {
  const n = scoreMatrix.length;
  const costMatrix = scoreMatrix.map((row) => row.map((s) => -s));
  const { assignment, totalCost, u, v } = hungarianMinCost(costMatrix);
  const totalScore = -totalCost;

  // Heurística de empate: conta arestas de custo reduzido zero no grafo
  // completo. Mais que n arestas de custo zero é indício forte (não prova
  // formal) de que existe alocação alternativa com a mesma soma ótima.
  let arestasZero = 0;
  const EPS = 1e-9;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (Math.abs(costMatrix[i][j] - u[i + 1] - v[j + 1]) < EPS) arestasZero++;
    }
  }
  return { assignment, totalScore, hasMultipleOptima: arestasZero > n };
}

function rodarTestesInternosHungaro() {
  function aproxIgual(a, b, eps = 1e-6) { return Math.abs(a - b) < eps; }
  const testes = [
    { nome: "diagonal dominante", matriz: [[100,0,0],[0,100,0],[0,0,100]], soma: 300, multiplos: false },
    { nome: "2x2 empatado", matriz: [[100,100],[100,100]], soma: 200, multiplos: true },
    { nome: "3x3 aditiva degenerada", matriz: [[1,2,3],[4,5,6],[7,8,9]], soma: 15, multiplos: true },
    { nome: "4x4 bloco empatado + bloco único", matriz: [[100,100,0,0],[100,100,0,0],[0,0,100,50],[0,0,50,100]], soma: 400, multiplos: true },
  ];
  let ok = true;
  console.log("=== PatoVetZee — testes internos do algoritmo húngaro ===");
  for (const t of testes) {
    const r = hungarianMaxAssignment(t.matriz);
    const somaOk = aproxIgual(r.totalScore, t.soma);
    const multOk = r.hasMultipleOptima === t.multiplos;
    ok = ok && somaOk && multOk;
    console.log(`[${somaOk && multOk ? "PASSOU" : "FALHOU"}] ${t.nome}: soma=${r.totalScore} (esperado ${t.soma}), múltiplos=${r.hasMultipleOptima} (esperado ${t.multiplos})`);
  }
  console.log(ok ? "Todos os testes do húngaro passaram." : "Há testes com falha no húngaro — revisar.");
  return ok;
}

const STORAGE_PREFIXO_PROGRESSO = "patovetzee_progresso_";
const STORAGE_HISTORICO = "patovetzee_historico";
const DEBUG = new URLSearchParams(location.search).get("debug") === "1";

// Estado mutável único do jogo em andamento (reset a cada nova partida).
let estado = {
  desafio: null,
  ordemCategoriasIds: [],      // ordem "de exibição" (embaralhada por seed), reduz a cada escolha
  ordemDoencasIds: [],         // ordem fixa de apresentação das 9 doenças
  matriz: null,                // matriz[doencaId][categoriaId] = pontuação
  indiceAtual: 0,               // 0..8, índice da doença atual na sequência
  alocacoes: [],                // [{doencaId, categoriaId, score}], em ordem de confirmação
  modoPratica: false,           // true = desafio personalizado ou "jogar de novo"; não conta como oficial
  travaInteracao: false,        // evita duplo clique durante animação de confirmação
};

// Deriva a pontuação de um par (doença, parâmetro) diretamente do banco —
// nunca é armazenada, sempre calculada.
function calcularPontuacao(doencaId, paramRef) {
  const doenca = MAPA_DOENCAS[doencaId];
  if (!doenca) return 0;
  if (paramRef.grupo === "binario") {
    return doenca.parametros_binarios[paramRef.id] ? 100 : 0;
  }
  return doenca.parametros_graduais[paramRef.id];
}

// Monta a matriz completa doença×categoria para o desafio (usada pelo
// húngaro e para exibir a pontuação de cada escolha do jogador).
function construirMatriz(desafio) {
  const matriz = {};
  for (const doencaId of desafio.doencas_selecionadas) {
    matriz[doencaId] = {};
    for (const paramRef of desafio.parametros_selecionados) {
      matriz[doencaId][paramRef.id] = calcularPontuacao(doencaId, paramRef);
    }
  }
  return matriz;
}

// Checagem simples de "qualidade do desafio" (pedida no briefing): avisa no
// console quando a seleção de parâmetros gera pouca variação (puzzle sem
// graça) — não bloqueia o jogo, é só um alerta para quem está curando o
// conteúdo do dia.
function avaliarQualidadeDesafio(desafio, matriz) {
  const doencaIds = desafio.doencas_selecionadas;
  const paramRefs = desafio.parametros_selecionados;

  // Categorias "constantes": todas as doenças têm o mesmo valor.
  let categoriasConstantes = 0;
  for (const ref of paramRefs) {
    const valores = doencaIds.map((id) => matriz[id][ref.id]);
    if (valores.every((v) => v === valores[0])) categoriasConstantes++;
  }

  // Doenças com pelo menos um "true isolado" (100 sem empate) em alguma
  // categoria binária selecionada.
  const doencasComTrueIsolado = new Set();
  for (const ref of paramRefs) {
    if (ref.grupo !== "binario") continue;
    const valores = doencaIds.map((id) => matriz[id][ref.id]);
    const indicesComCem = valores.reduce((acc, v, i) => (v === 100 ? acc.concat(i) : acc), []);
    if (indicesComCem.length === 1) doencasComTrueIsolado.add(doencaIds[indicesComCem[0]]);
  }

  const nGraduais = paramRefs.filter((r) => r.grupo === "gradual").length;
  const misturaForaDoRecomendado =
    nGraduais < MIX_RECOMENDADO.min_graduais || nGraduais > MIX_RECOMENDADO.max_graduais;

  console.log(
    `[PatoVetZee] Checagem de qualidade do desafio "${desafio.id}": ` +
    `${categoriasConstantes} categoria(s) constante(s) de ${paramRefs.length}; ` +
    `${doencasComTrueIsolado.size} doença(s) com valor isolado; ` +
    `${nGraduais} categoria(s) gradual(is) (recomendado ${MIX_RECOMENDADO.min_graduais}-${MIX_RECOMENDADO.max_graduais}).`
  );
  if (categoriasConstantes > 3) {
    console.warn(
      `[PatoVetZee] AVISO: ${categoriasConstantes} categorias têm o mesmo valor para todas as doenças — ` +
      `esse desafio pode estar com pouca variação e ficar sem graça. Considere trocar alguns parâmetros.`
    );
  }
  if (misturaForaDoRecomendado) {
    console.warn(
      `[PatoVetZee] AVISO: mistura de ${nGraduais} categorias graduais está fora da faixa recomendada ` +
      `(${MIX_RECOMENDADO.min_graduais}-${MIX_RECOMENDADO.max_graduais}).`
    );
  }
}

// Inicializa `estado` a partir de um objeto de desafio (oficial ou
// personalizado), calculando ordem determinística e a matriz de pontuação.
function iniciarPartida(desafio, { pratica = false } = {}) {
  const matriz = construirMatriz(desafio);
  avaliarQualidadeDesafio(desafio, matriz);

  const seedBase = (desafio.id || desafio.data || "desafio") + (pratica ? "|" + Date.now() : "");
  const ordemDoencasIds = embaralharComSeed(desafio.doencas_selecionadas, seedBase + "|ordem-doencas");
  const ordemCategoriasIds = embaralharComSeed(
    desafio.parametros_selecionados.map((r) => r.id),
    seedBase + "|ordem-categorias"
  );

  estado = {
    desafio,
    matriz,
    ordemDoencasIds,
    ordemCategoriasIds,
    indiceAtual: 0,
    alocacoes: [],
    modoPratica: pratica,
    travaInteracao: false,
  };
}

const appEl = document.getElementById("app");
const liveRegionEl = document.getElementById("live-region");

function anunciar(texto) {
  liveRegionEl.textContent = "";
  // pequeno delay para o leitor de tela perceber a mudança mesmo se o texto
  // for igual ao anterior.
  requestAnimationFrame(() => { liveRegionEl.textContent = texto; });
}

// Helper mínimo para montar DOM sem innerHTML (evita risco de conteúdo de
// desafios personalizados quebrar a página).
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else if (v !== false && v !== null && v !== undefined) node.setAttribute(k, v);
    }
  }
  (children || []).forEach((c) => { if (c) node.appendChild(c); });
  return node;
}

/* --------- Tela inicial --------- */

// Barra de progresso (9 pontos). `doencasFeitasCount` = quantas já foram
// alocadas; `indiceEmDestaque` = índice a marcar como "atual" (ou -1 se
// nenhuma — usado na tela intermediária de revelação de pontuação, onde a
// decisão da vez já foi tomada e ainda não há uma "atual" nova em jogo).
function construirProgresso(doencasFeitasCount, indiceEmDestaque) {
  return el("div", { class: "progresso", "aria-hidden": "true" },
    estado.ordemDoencasIds.map((_, i) => el("span", {
      class: "ponto" + (i < doencasFeitasCount ? " feito" : i === indiceEmDestaque ? " atual" : ""),
    }))
  );
}

// Roteiro completo do dia: o jogador só ALOCA a doença atual, mas já sabe
// quais são todas as outras 8 (e em que ordem vão aparecer) — isso é
// proposital, pra ele conseguir planejar em qual categoria vale mais a pena
// "gastar" a doença de agora, pensando no que ainda vem.
function construirCardRoteiro(doencasFeitasCount, indiceEmDestaque) {
  const cardRoteiro = el("section", { class: "card" }, [
    el("h2", { text: "Sequência de doenças de hoje" }),
  ]);
  const listaRoteiro = el("ol", { class: "lista-roteiro" },
    estado.ordemDoencasIds.map((id, i) => {
      const d = MAPA_DOENCAS[id];
      const status = i < doencasFeitasCount ? "feita" : i === indiceEmDestaque ? "atual" : "futura";
      const icone = status === "feita" ? "✅" : status === "atual" ? "👉" : "⏳";
      return el("li", { class: "item-roteiro " + status }, [
        el("span", { "aria-hidden": "true", text: icone + " " }),
        document.createTextNode(d.nome),
      ]);
    })
  );
  cardRoteiro.appendChild(listaRoteiro);
  return cardRoteiro;
}

/* --------- Tela: doença atual --------- */
function renderDoencaAtual() {
  limparApp();
  const doencaId = estado.ordemDoencasIds[estado.indiceAtual];

  appEl.appendChild(renderMarca());
  appEl.appendChild(construirProgresso(estado.alocacoes.length, estado.indiceAtual));

    el("h2", { text: doenca.nome }),
    el("p", { class: "aviso-irreversivel", text: "Escolha a categoria abaixo. Depois de confirmar, não dá para voltar." }),
  ]);

  appEl.appendChild(construirCardRoteiro(estado.alocacoes.length, estado.indiceAtual));

  const categoriasRestantes = estado.ordemCategoriasIds.filter(
    (catId) => !estado.alocacoes.some((a) => a.categoriaId === catId)
  );

      el("span", { class: "texto-categoria", text: label }),
    ]);
    grade.appendChild(botao);
  });

  const primeiroBotao = grade.querySelector("button");
  if (primeiroBotao) primeiroBotao.focus({ preventScroll: true });

  anunciar(`Doença ${estado.indiceAtual + 1} de ${estado.ordemDoencasIds.length}: ${doenca.nome}. Escolha uma categoria.`);
}

/* --------- Tela intermediária: pontuação da escolha que acabou de ser
   confirmada --------- */
// Aparece entre uma doença e a próxima: mostra quantos pontos aquele par
// doença-categoria valeu e a explicação clínica, antes de revelar a doença
// seguinte. Continua irreversível — é só uma revelação, não dá pra trocar.
function renderPontuacaoEscolha(doencaId, categoriaId, score) {
  limparApp();
  const doenca = MAPA_DOENCAS[doencaId];
  const label = obterLabelParametro(categoriaId);
  const explicacao = (estado.desafio.explicacoes[doencaId] && estado.desafio.explicacoes[doencaId][categoriaId]) ||
    "Explicação não disponível para este desafio.";
  const indiceConfirmado = estado.indiceAtual; // ainda não incrementado neste ponto
  const ehUltima = indiceConfirmado + 1 >= estado.ordemDoencasIds.length;

  appEl.appendChild(renderMarca());
  appEl.appendChild(construirProgresso(estado.alocacoes.length, -1));

  const cardPontuacao = el("section", { class: "card carta-doenca anim-entrada", "aria-live": "polite" }, [
    el("span", { class: "rotulo-passo", text: `Doença ${indiceConfirmado + 1} de ${estado.ordemDoencasIds.length}` }),
    el("h2", { text: `${doenca.nome} → ${label}` }),
    el("div", { class: "badge-pontuacao " + (score >= 50 ? "cheio" : "vazio"), text: `${score} pontos` }),
    el("p", { class: "texto-explicacao", text: explicacao }),
  ]);
  appEl.appendChild(cardPontuacao);

  appEl.appendChild(construirCardRoteiro(estado.alocacoes.length, -1));

  const cardContinuar = el("section", { class: "card", style: "text-align:center" }, [
    el("button", {
      class: "btn",

/* --------- Confete --------- */
function dispararConfete(intensidade) {
  const cores = ["#FF6B6B", "#FFD166", "#06D6A0", "#4ECDC4", "#C77DFF"];
  const camada = document.getElementById("confetti-layer");
  const n = intensidade === "alta" ? 70 : 28;

function onEscolherCategoria(categoriaId, botaoEl) {
  if (estado.travaInteracao) return;
  estado.travaInteracao = true;

  const doencaId = estado.ordemDoencasIds[estado.indiceAtual];
  const score = estado.matriz[doencaId][categoriaId];

  // Desabilita todos os botões da grade e mostra o feedback "confirmado" no
  // botão escolhido (um "check" animado) antes de revelar a pontuação na
  // tela seguinte.
  const grade = botaoEl.closest(".grade-categorias");
  grade.querySelectorAll("button").forEach((b) => { b.disabled = true; b.tabIndex = -1; });
  botaoEl.classList.add("confirmando");
  botaoEl.setAttribute("aria-selected", "true");

  anunciar(`Confirmado: ${MAPA_DOENCAS[doencaId].nome} alocada. Calculando pontuação...`);

  estado.alocacoes.push({ doencaId, categoriaId, score });

  setTimeout(() => {
    renderPontuacaoEscolha(doencaId, categoriaId, score);
  }, 550);
}

// Navegação por setas dentro da grade de categorias (roving focus simples).
// Enter/Espaço já funcionam nativamente em <button>.
function configurarNavegacaoTeclado(grade) {
  grade.addEventListener("keydown", (ev) => {
    const botoes = Array.from(grade.querySelectorAll("button:not([disabled])"));
    const atual = document.activeElement;
    const i = botoes.indexOf(atual);
    if (i === -1) return;

    let proximo = null;
    if (ev.key === "ArrowDown" || ev.key === "ArrowRight") proximo = botoes[(i + 1) % botoes.length];
    else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") proximo = botoes[(i - 1 + botoes.length) % botoes.length];
    else if (ev.key === "Home") proximo = botoes[0];
    else if (ev.key === "End") proximo = botoes[botoes.length - 1];

    if (proximo) {
      ev.preventDefault();
      proximo.focus();
    }
  });
}


/* =========================================================================
 * 8. CÁLCULO E EXIBIÇÃO DO RESULTADO FINAL
 * ======================================================================= */

function calcularResultadoFinal() {
  const desafio = estado.desafio;
  const totalScore = estado.alocacoes.reduce((s, a) => s + a.score, 0);

  // Monta a matriz n×n na ordem fixa doencas_selecionadas × parametros_selecionados
  // para rodar o húngaro (a ordem de exibição ao jogador foi só cosmética).
  const doencaIds = desafio.doencas_selecionadas;
  const catIds = desafio.parametros_selecionados.map((r) => r.id);
  const matrizNumerica = doencaIds.map((dId) => catIds.map((cId) => estado.matriz[dId][cId]));

  const otimo = hungarianMaxAssignment(matrizNumerica);
  const optimalScore = otimo.totalScore;
  const alocacaoOtima = otimo.assignment.map((catIdx, doencaIdx) => ({
    doencaId: doencaIds[doencaIdx],
    categoriaId: catIds[catIdx],
    score: matrizNumerica[doencaIdx][catIdx],
  }));

  const efficiency = optimalScore > 0 ? (totalScore / optimalScore) * 100 : 100;

  return { totalScore, optimalScore, efficiency, alocacaoOtima, hasMultipleOptima: otimo.hasMultipleOptima };
}

function renderResultado() {
  const resultado = calcularResultadoFinal();
  salvarResultado(resultado);
  renderTelaResultado(resultado);
}

function salvarResultado(resultado) {
  const registro = {
    completed: true,
    timestamp: Date.now(),
    desafioId: estado.desafio.id,
    totalScore: resultado.totalScore,
    optimalScore: resultado.optimalScore,
    efficiency: resultado.efficiency,
    alocacoesJogador: estado.alocacoes,
  };

  if (!estado.modoPratica) {
    try {
      localStorage.setItem(STORAGE_PREFIXO_PROGRESSO + estado.desafio.id, JSON.stringify(registro));
    } catch (e) {
      console.warn("[PatoVetZee] Não foi possível salvar o progresso no localStorage:", e);
    }
  }

  // Histórico sempre recebe a partida (oficial ou prática), para consulta.
  try {
    const historico = lerHistorico();
    historico.unshift({
      desafioId: estado.desafio.id,
      titulo: estado.desafio.titulo,
      data: estado.desafio.data || null,
      pratica: estado.modoPratica,
      totalScore: resultado.totalScore,
      optimalScore: resultado.optimalScore,
      efficiency: resultado.efficiency,
      timestamp: Date.now(),
    });
    localStorage.setItem(STORAGE_HISTORICO, JSON.stringify(historico.slice(0, 50)));
  } catch (e) {
    console.warn("[PatoVetZee] Não foi possível salvar o histórico no localStorage:", e);
  }

  // Sincronização remota (login/ranking) é best-effort e assíncrona — não
  // bloqueia a tela de resultado nem quebra nada se estiver sem internet ou
  // sem login (ver seção 10).
  salvarResultadoRemoto(resultado);
}

const SUPABASE_URL = "https://wyyxuvnrlutqjxtamhus.supabase.co";

// qualquer uma dessas condições falhar, o jogo inteiro continua funcionando

const SUPABASE_CONFIGURADO =

// Estado de sessão do jogador. usuario=null significa "modo convidado".
let sessao = { usuario: null, apelido: null };

// Roda no carregamento da página: o SDK do Supabase já guarda o token de
// sessão no localStorage por conta própria, então isto só recupera a sessão
// existente (se houver) sem exigir login de novo a cada visita.
async function verificarSessaoAtual() {
  if (!supabaseClient) return;
  try {
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session && data.session.user) {
      await carregarPerfilDaSessao(data.session.user);
    }
  } catch (e) {
    console.warn("[PatoVetZee] Não foi possível verificar a sessão de login:", e);
  }
}

async function carregarPerfilDaSessao(usuario) {
  sessao.usuario = usuario;
  const { data: perfil } = await supabaseClient
    .from("perfis")
    .select("apelido")
    .eq("id", usuario.id)
    .maybeSingle();
  sessao.apelido = perfil ? perfil.apelido : null;
}

async function fazerLogout() {
  if (supabaseClient) await supabaseClient.auth.signOut();
  sessao = { usuario: null, apelido: null };
  renderIntro();
}

function traduzirErroAuth(error) {
  const msg = (error && error.message) || "Erro desconhecido.";
  if (/invalid login credentials/i.test(msg)) return "E-mail ou senha incorretos.";
  if (/already registered/i.test(msg)) return "Já existe uma conta com este e-mail — tente entrar em vez de criar conta.";
  if (/password should be at least/i.test(msg)) return "A senha precisa ter pelo menos 6 caracteres.";
  return msg;
}

// Envia o resultado de um desafio OFICIAL (não prática, não personalizado)
// para o Supabase, se o jogador estiver logado e já tiver apelido definido.
// Best-effort: roda em paralelo à gravação local (seção 9); se falhar (sem
// internet, projeto pausado, etc.) o jogo não quebra — o resultado
// continua salvo no localStorage do aparelho.
async function salvarResultadoRemoto(resultado) {
  if (!supabaseClient || !sessao.usuario || !sessao.apelido) return;
  if (estado.modoPratica || estado.desafio.personalizado) return;

  const { error } = await supabaseClient.from("resultados").upsert({
    user_id: sessao.usuario.id,
    desafio_id: estado.desafio.id,
    data_desafio: estado.desafio.data,
    total_score: resultado.totalScore,
    optimal_score: resultado.optimalScore,
    efficiency: resultado.efficiency,
  });

  if (error) {
    console.warn("[PatoVetZee] Não foi possível salvar o resultado no ranking (permanece salvo localmente):", error.message);
  }
}

function inicioSemanaISO(data) {
  const d = new Date(Date.UTC(data.getFullYear(), data.getMonth(), data.getDate()));
  const diaISO = (d.getUTCDay() + 6) % 7; // 0 = segunda-feira
  d.setUTCDate(d.getUTCDate() - diaISO);
  return d.toISOString().slice(0, 10);
}
function inicioMesISO(data) {

    return;
  }

  const infoAba = ABAS_RANKING.find((a) => a.id === abaSelecionada);
  const abas = el("div", { class: "abas-ranking", role: "tablist" },
    ABAS_RANKING.map((a) => el("button", {
      class: "aba-ranking" + (a.id === abaSelecionada ? " ativa" : ""),
      type: "button",
      role: "tab",
      "aria-selected": String(a.id === abaSelecionada),
      onclick: () => renderRanking(a.id),
      text: a.label,
    }))
  );

  const cardRanking = el("section", { class: "card" }, [
    el("h2", { text: "Ranking — " + infoAba.label }),
  ]);
  cardRanking.appendChild(abas);
  const carregandoEl = el("p", { text: "Carregando..." });
  cardRanking.appendChild(carregandoEl);
  appEl.appendChild(cardRanking);

  appEl.appendChild(el("section", { class: "card", style: "text-align:center" }, [
    el("button", { class: "btn secundario", text: "⬅ Voltar", onclick: renderIntro }),
  ]));

  let query = supabaseClient.from(infoAba.tabela).select("*");
  if (abaSelecionada === "diario") query = query.eq("desafio_id", DESAFIO_DO_DIA.id);
  else if (abaSelecionada === "semanal") query = query.eq("inicio_semana", inicioSemanaISO(new Date()));
  else if (abaSelecionada === "mensal") query = query.eq("inicio_mes", inicioMesISO(new Date()));
  query = query.order("posicao", { ascending: true }).limit(50);

  const { data, error } = await query;
  carregandoEl.remove();

  if (error) {
    cardRanking.appendChild(el("p", { class: "campo-erro", text: "Não foi possível carregar o ranking: " + error.message }));
    return;
  }
  if (!data || data.length === 0) {
    cardRanking.appendChild(el("p", { text: "Ainda não há resultados suficientes para montar este ranking." }));
    return;
  }

  const medalhas = ["🥇", "🥈", "🥉"];
  const tabela = el("table", { class: "tabela-ranking" }, [
    el("thead", {}, [el("tr", {}, [
      el("th", { text: "#" }),
      el("th", { text: "Apelido" }),
      el("th", { text: abaSelecionada === "diario" ? "Pontos" : "Pontos no período" }),
      ...(abaSelecionada !== "diario" ? [el("th", { text: "Desafios" })] : []),
    ])]),
  ]);
  const corpo = el("tbody");
  data.forEach((linha, i) => {
    const ehMinhaLinha = !!(sessao.apelido && linha.apelido === sessao.apelido);
    const celulas = [
      el("td", { text: (medalhas[i] || "") + (i + 1) }),
      el("td", { text: linha.apelido }),
      el("td", { text: String(abaSelecionada === "diario" ? linha.total_score : linha.pontos_periodo) }),
    ];
    if (abaSelecionada !== "diario") celulas.push(el("td", { text: String(linha.desafios_jogados) }));
    corpo.appendChild(el("tr", { class: ehMinhaLinha ? "minha-linha" : "" }, celulas));
  });
  tabela.appendChild(corpo);
  cardRanking.appendChild(tabela);
}


/* =========================================================================
 * MODO PERSONALIZADO (colar/upload de um JSON de desafio)
 * -------------------------------------------------------------------------
 * Aceita um objeto no mesmo formato de DESAFIO_DO_DIA (seção 2), referenciando
 * doenças e parâmetros que já existem no BANCO_DOENCAS/CATALOGO_PARAMETROS
 * embutidos nesta página. Útil para montar desafios de aula sem editar o
 * arquivo — basta manter uma cópia deste HTML e trocar o JSON colado.
 * ======================================================================= */

function validarDesafioPersonalizado(json) {
  const erros = [];
  if (!json || typeof json !== "object") { erros.push("O conteúdo não é um objeto JSON válido."); return { valido: false, erros }; }

  if (!Array.isArray(json.doencas_selecionadas) || json.doencas_selecionadas.length !== 9) {
    erros.push("`doencas_selecionadas` precisa ser uma lista com exatamente 9 ids de doença.");
  } else {
    json.doencas_selecionadas.forEach((id) => { if (!MAPA_DOENCAS[id]) erros.push(`Doença desconhecida: "${id}".`); });
    const unicos = new Set(json.doencas_selecionadas);
    if (unicos.size !== json.doencas_selecionadas.length) erros.push("`doencas_selecionadas` tem ids repetidos.");
  }

  if (!Array.isArray(json.parametros_selecionados) || json.parametros_selecionados.length !== 9) {
    erros.push("`parametros_selecionados` precisa ser uma lista com exatamente 9 itens {id, grupo}.");
  } else {
    json.parametros_selecionados.forEach((ref) => {
      if (!ref || (ref.grupo !== "binario" && ref.grupo !== "gradual")) {
        erros.push(`Parâmetro com \`grupo\` inválido: ${JSON.stringify(ref)} (use "binario" ou "gradual").`);
        return;
      }
      const catalogoDoGrupo = ref.grupo === "binario" ? CATALOGO_PARAMETROS.binarios : CATALOGO_PARAMETROS.graduais;
      if (!catalogoDoGrupo[ref.id]) erros.push(`Parâmetro desconhecido no grupo "${ref.grupo}": "${ref.id}".`);
    });
    const chaves = json.parametros_selecionados.map((r) => r && r.grupo + ":" + r.id);
    if (new Set(chaves).size !== chaves.length) erros.push("`parametros_selecionados` tem itens repetidos.");
  }

  if (!json.id) erros.push("Falta o campo `id` (identificador único do desafio).");

  return { valido: erros.length === 0, erros };
}

function abrirModalPersonalizado() {
  const fundo = el("div", { class: "modal-fundo", onclick: (ev) => { if (ev.target === fundo) fundo.remove(); } });
  const erroEl = el("div", { class: "campo-erro" });
  const textarea = document.createElement("textarea");
  textarea.setAttribute("aria-label", "Cole aqui o JSON do desafio personalizado");
  textarea.placeholder = '{\n  "id": "aula-neoplasias-1",\n  "doencas_selecionadas": [...9 ids...],\n  "parametros_selecionados": [...9 {id, grupo}...],\n  "explicacoes": { ... } // opcional\n}';

  const inputArquivo = document.createElement("input");
  inputArquivo.type = "file";
  inputArquivo.accept = "application/json,.json";
  inputArquivo.addEventListener("change", () => {
    const arquivo = inputArquivo.files[0];
    if (!arquivo) return;
    const leitor = new FileReader();
    leitor.onload = () => { textarea.value = String(leitor.result); };
    leitor.readAsText(arquivo);
  });

  const caixa = el("div", { class: "modal-caixa" }, [
    el("h2", { text: "Carregar desafio personalizado" }),
    el("p", { text: "Cole o JSON abaixo ou selecione um arquivo .json com o mesmo formato do desafio do dia." }),
    inputArquivo,
    textarea,
    erroEl,
    el("div", {}, [
      el("button", { class: "btn", text: "Carregar e começar", onclick: () => {
        let json;
        try { json = JSON.parse(textarea.value); }
        catch (e) { erroEl.textContent = "JSON inválido: " + e.message; return; }

        const { valido, erros } = validarDesafioPersonalizado(json);
        if (!valido) { erroEl.textContent = erros.join("\n"); return; }

        json.personalizado = true;
        json.explicacoes = json.explicacoes || {};
        json.titulo = json.titulo || "Desafio personalizado";
        fundo.remove();
        iniciarPartida(json, { pratica: true });
        renderDoencaAtual();
      }}),
      el("button", { class: "btn fantasma", text: "Cancelar", onclick: () => fundo.remove() }),
    ]),
  ]);
  fundo.appendChild(caixa);
  document.body.appendChild(fundo);
  textarea.focus();
}


/* =========================================================================
 * INICIALIZAÇÃO
 * ======================================================================= */

async function init() {
  if (DEBUG) {
    console.log("[PatoVetZee] Modo debug ativo (?debug=1).");
    rodarTestesInternosHungaro();
  }
  // Checagem de integridade do banco roda sempre (é barata e evita passar
  // um desafio quebrado pra turma por causa de um campo esquecido/errado).
  validarBancoDoencas();

  // Renderiza a tela inicial já, sem esperar a verificação de sessão (que é
  // assíncrona) — evita tela em branco. Se havia uma sessão de login salva,
  // a tela inicial é atualizada de novo em seguida para refletir isso.
  renderIntro();
  await verificarSessaoAtual();
  if (sessao.usuario) renderIntro();
}

init();
