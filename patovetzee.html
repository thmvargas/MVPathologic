  filtroEspecie.value = estadoAdmin.especie;
  filtroEspecie.addEventListener("change", () => { estadoAdmin.especie = filtroEspecie.value; renderAdmin(); });
  linhaSelects.appendChild(filtroEspecie);

  cardFiltros.appendChild(linhaSelects);
  appEl.appendChild(cardFiltros);

  const termo = estadoAdmin.busca.trim().toLowerCase();
  const listaFiltrada = BANCO_DOENCAS.filter((d) => {
    if (estadoAdmin.sistema && d.sistema !== estadoAdmin.sistema) return false;
    if (estadoAdmin.especie && d.especie !== estadoAdmin.especie) return false;
    if (termo && !(d.nome.toLowerCase().includes(termo) || d.id.toLowerCase().includes(termo))) return false;
    return true;
  }).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));

  const cardLista = el("section", { class: "card" }, [
    el("h2", { text: `Resultado (${listaFiltrada.length})` }),
  ]);
  if (listaFiltrada.length === 0) {
    cardLista.appendChild(el("p", { text: "Nenhuma doença encontrada com esse filtro." }));
  }
  listaFiltrada.forEach((d) => {
    cardLista.appendChild(el("div", { class: "linha-admin-doenca" }, [
      el("div", { class: "linha-admin-info" }, [
        el("strong", { text: d.nome }),
        el("span", { class: "linha-admin-meta", text: `${d.especie} · ${CATALOGO_SISTEMAS[d.sistema] || d.sistema} · id: ${d.id}` }),
      ]),
      el("div", { class: "linha-admin-acoes" }, [
        el("button", { class: "btn secundario btn-pequeno", text: "Editar", onclick: () => renderEditorDoenca(d.id) }),
        el("button", { class: "btn fantasma btn-pequeno", text: "Excluir", onclick: () => confirmarExclusaoDoenca(d.id) }),
      ]),
    ]));
  });
  appEl.appendChild(cardLista);

  restauraFoco(foco);
}

async function confirmarExclusaoDoenca(doencaId) {
  const doenca = MAPA_DOENCAS[doencaId];
  if (!doenca) return;

  if (DESAFIO_DO_DIA.doencas_selecionadas.includes(doencaId)) {
    window.alert(
      `"${doenca.nome}" faz parte do desafio diário oficial (DESAFIO_DO_DIA, fixo no código-fonte do jogo).\n\n` +
      `Excluir agora quebraria esse desafio pra todo mundo. Peça pra alterar DESAFIO_DO_DIA no código antes de excluir esta doença.`
    );
    return;
  }

  const confirmado = window.confirm(`Excluir "${doenca.nome}" definitivamente? Essa ação não pode ser desfeita.`);
  if (!confirmado) return;

  if (!supabaseClient) { window.alert("Supabase não configurado — não é possível salvar exclusões."); return; }

  const { error } = await supabaseClient.from("doencas").delete().eq("id", doencaId);
  if (error) { window.alert("Erro ao excluir: " + error.message); return; }

  BANCO_DOENCAS = BANCO_DOENCAS.filter((d) => d.id !== doencaId);
  MAPA_DOENCAS = indexarBancoDoencas(BANCO_DOENCAS);
  renderAdmin();
}

/* --------- Formulário de criação/edição --------- */
function renderEditorDoenca(doencaIdExistente) {
  if (!sessao.isAdmin) { renderIntro(); return; }
  limparApp();
  appEl.appendChild(renderMarca());

  const editando = !!doencaIdExistente;
  const doencaAtual = editando ? MAPA_DOENCAS[doencaIdExistente] : null;
  if (editando && !doencaAtual) {
    appEl.appendChild(el("section", { class: "card" }, [
      el("p", { text: "Doença não encontrada (pode ter sido excluída em outra aba)." }),
      el("button", { class: "btn secundario", text: "⬅ Voltar", onclick: renderAdmin }),
    ]));
    return;
  }

  const erroEl = el("p", { class: "campo-erro" });

  const campoId = document.createElement("input");
  campoId.type = "text"; campoId.className = "campo";
  campoId.placeholder = "ex.: nova_doenca_canina (minúsculo, sem espaço/acento)";
  campoId.value = editando ? doencaAtual.id : "";
  campoId.disabled = editando;

  const campoNome = document.createElement("input");
  campoNome.type = "text"; campoNome.className = "campo";
  campoNome.value = editando ? doencaAtual.nome : "";

  const especiesConhecidas = [...new Set(BANCO_DOENCAS.map((d) => d.especie))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  const listaEspecies = document.createElement("datalist");
  listaEspecies.id = "lista-especies-admin";
  especiesConhecidas.forEach((esp) => listaEspecies.appendChild(new Option(esp, esp)));

  const campoEspecie = document.createElement("input");
  campoEspecie.type = "text"; campoEspecie.className = "campo";
  campoEspecie.setAttribute("list", "lista-especies-admin");
  campoEspecie.placeholder = "ex.: Canina";
  campoEspecie.value = editando ? doencaAtual.especie : "";

  const campoSistema = document.createElement("select");
  campoSistema.className = "campo";
  Object.entries(CATALOGO_SISTEMAS).forEach(([id, label]) => campoSistema.appendChild(new Option(label, id)));
  campoSistema.value = editando ? doencaAtual.sistema : Object.keys(CATALOGO_SISTEMAS)[0];

  const campoDica = document.createElement("textarea");
  campoDica.className = "campo"; campoDica.rows = 2;
  campoDica.placeholder = "Reservado para uma versão futura — não aparece pro jogador hoje.";
  campoDica.value = (editando && doencaAtual.dica) || "";

  appEl.appendChild(el("section", { class: "card" }, [
    el("h2", { text: editando ? `Editando: ${doencaAtual.nome}` : "Nova doença" }),
    erroEl,
    el("label", { class: "rotulo-campo", text: "Id (uso interno — não aparece pro jogador; não dá pra mudar depois de criada)" }),
    campoId,
    listaEspecies,
    el("label", { class: "rotulo-campo", text: "Nome" }),
    campoNome,
    el("label", { class: "rotulo-campo", text: "Espécie" }),
    campoEspecie,
    el("label", { class: "rotulo-campo", text: "Sistema (Modo por sistemas)" }),
    campoSistema,
    el("label", { class: "rotulo-campo", text: "Dica (opcional, reservado)" }),
    campoDica,
  ]));

  const camposBinarios = {};
  const camposGraduais = {};

  ORDEM_GRUPOS_TEMATICOS.forEach((grupo) => {
    const binariosDoGrupo = Object.entries(CATALOGO_PARAMETROS.binarios).filter(([, def]) => def.grupo_tematico === grupo);
    const graduaisDoGrupo = Object.entries(CATALOGO_PARAMETROS.graduais).filter(([, def]) => def.grupo_tematico === grupo);
    if (binariosDoGrupo.length === 0 && graduaisDoGrupo.length === 0) return;

    const cardGrupo = el("section", { class: "card" }, [el("h2", { text: NOMES_GRUPO_TEMATICO[grupo] })]);

    if (binariosDoGrupo.length > 0) {
      const grade = el("div", { class: "grade-checkboxes" });
      binariosDoGrupo.forEach(([id, def]) => {
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = editando ? !!doencaAtual.parametros_binarios[id] : false;
        input.id = "campo-bin-" + id;
        camposBinarios[id] = input;
        const label = document.createElement("label");
        label.className = "item-checkbox";
        label.htmlFor = input.id;
        label.appendChild(input);
        label.appendChild(document.createTextNode(" " + def.label));
        grade.appendChild(label);
      });
      cardGrupo.appendChild(grade);
    }

    graduaisDoGrupo.forEach(([id, def]) => {
      const input = document.createElement("input");
      input.type = "number"; input.min = "0"; input.max = "100";
      input.className = "campo campo-numero";
      input.value = editando ? doencaAtual.parametros_graduais[id] : 0;
      camposGraduais[id] = input;
      cardGrupo.appendChild(el("div", { class: "linha-gradual" }, [
        el("label", { class: "rotulo-campo", text: def.label }),
        input,
        el("p", { class: "ajuda-campo", text: def.criterio_referencia }),
      ]));
    });

    appEl.appendChild(cardGrupo);
  });

  const btnSalvar = el("button", { class: "btn", text: editando ? "Salvar alterações" : "Criar doença" });
  btnSalvar.addEventListener("click", async () => {
    erroEl.textContent = "";
    const id = campoId.value.trim();
    const nome = campoNome.value.trim();
    const especie = campoEspecie.value.trim();
    const sistema = campoSistema.value;
    const dica = campoDica.value.trim() || null;

    if (!id || !/^[a-z][a-z0-9_]*$/.test(id)) {
      erroEl.textContent = "Id inválido: use só letras minúsculas, números e underscore, começando com letra (ex.: nova_doenca_canina).";
      return;
    }
    if (!nome) { erroEl.textContent = "Preencha o nome."; return; }
    if (!especie) { erroEl.textContent = "Preencha a espécie."; return; }
    if (!editando && MAPA_DOENCAS[id]) { erroEl.textContent = `Já existe uma doença com o id "${id}".`; return; }

    const parametros_binarios = {};
    Object.keys(camposBinarios).forEach((pid) => { parametros_binarios[pid] = camposBinarios[pid].checked; });
    const parametros_graduais = {};
    for (const pid of Object.keys(camposGraduais)) {
      const v = Number(camposGraduais[pid].value);
      if (!Number.isFinite(v) || v < 0 || v > 100) {
        erroEl.textContent = `Valor inválido em "${obterLabelParametro(pid)}" — precisa ser um número entre 0 e 100.`;
        return;
      }
      parametros_graduais[pid] = v;
    }

    const registro = { id, nome, especie, sistema, dica, parametros_binarios, parametros_graduais };

    if (!supabaseClient) { erroEl.textContent = "Supabase não configurado — não é possível salvar."; return; }

    btnSalvar.disabled = true;
    btnSalvar.textContent = "Salvando…";
    const { error } = await supabaseClient.from("doencas").upsert(registro);
    btnSalvar.disabled = false;
    btnSalvar.textContent = editando ? "Salvar alterações" : "Criar doença";

    if (error) {
      erroEl.textContent = "Erro ao salvar: " + error.message +
        (/row-level security|permission denied/i.test(error.message)
          ? " (sua conta pode não estar marcada como admin no Supabase — veja o passo 4 da migração 002.)"
          : "");
      return;
    }

    const idx = BANCO_DOENCAS.findIndex((d) => d.id === id);
    if (idx !== -1) BANCO_DOENCAS[idx] = registro; else BANCO_DOENCAS.push(registro);
    MAPA_DOENCAS = indexarBancoDoencas(BANCO_DOENCAS);
    renderAdmin();
  });

  appEl.appendChild(el("section", { class: "card", style: "text-align:center" }, [
    btnSalvar,
    el("button", { class: "btn fantasma", text: "Cancelar", onclick: renderAdmin }),
  ]));
}

/* --------- Categorias: criar categoria nova + listar as existentes ------ */
// Cria uma categoria (parâmetro binário ou gradual) nova: salva em
// `categorias` (migração 004), mistura em CATALOGO_PARAMETROS, e — passo
// essencial — preenche essa chave com um valor padrão neutro em TODAS as
// doenças existentes (senão elas ficariam "incompletas" e
// validarBancoDoencas() acusaria erro em cada uma). O padrão é só um ponto
// de partida: o professor edita doença por doença depois, pela tela de
// edição, pra refletir a característica de verdade onde fizer sentido.
async function adicionarCategoria(cat) {
  if (!supabaseClient) return { erro: "Supabase não configurado — não é possível salvar." };

  const { error: erroInsert } = await supabaseClient.from("categorias").insert({
    id: cat.id, grupo: cat.grupo, label: cat.label,
    grupo_tematico: cat.grupo_tematico, criterio_referencia: cat.criterio_referencia || null,
  });
  if (erroInsert) {
    return { erro: "Não foi possível criar a categoria: " + erroInsert.message +
      (/row-level security|permission denied/i.test(erroInsert.message) ? " (sua conta é admin?)" : "") };
  }

  const alvo = cat.grupo === "binario" ? CATALOGO_PARAMETROS.binarios : CATALOGO_PARAMETROS.graduais;
  alvo[cat.id] = { label: cat.label, grupo_tematico: cat.grupo_tematico };
  if (cat.grupo === "gradual" && cat.criterio_referencia) alvo[cat.id].criterio_referencia = cat.criterio_referencia;

  const campo = cat.grupo === "binario" ? "parametros_binarios" : "parametros_graduais";
  const valorPadrao = cat.grupo === "binario" ? false : 0;
  const doencasAtualizadas = BANCO_DOENCAS.map((d) => ({
    ...d,
    [campo]: { ...d[campo], [cat.id]: valorPadrao },
  }));

  const { error: erroBackfill } = await supabaseClient.from("doencas").upsert(doencasAtualizadas);
  if (erroBackfill) {
    return { erro: `Categoria "${cat.label}" criada, mas não deu pra atualizar as ${doencasAtualizadas.length} doenças existentes: ` + erroBackfill.message +
      " — elas vão aparecer como incompletas até isso ser corrigido (edite e salve cada uma, ou tente de novo)." };
  }

  BANCO_DOENCAS = doencasAtualizadas;
  MAPA_DOENCAS = indexarBancoDoencas(BANCO_DOENCAS);
  return { ok: true };
}

function renderCategorias() {
  if (!sessao.isAdmin) { renderIntro(); return; }

    el("button", { class: "btn fantasma", text: "⬅ Voltar à Administração", onclick: renderAdmin }),

  linhaCriterio.appendChild(el("label", { class: "rotulo-campo", text: "Critério de referência (0 e 100 significam o quê)" }));

    const grupo_tematico = campoTema.value;

    if (!id || !/^[a-z][a-z0-9_]*$/.test(id)) {

    const graduais = Object.entries(CATALOGO_PARAMETROS.graduais).filter(([, def]) => def.grupo_tematico === tema);
    if (binarias.length === 0 && graduais.length === 0) return;

    cardLista.appendChild(lista);
  });
  appEl.appendChild(cardLista);

/* --------- Painel do professor: desempenho de todos os alunos --------- */
// Diferente do ranking público (que só olha o desafio diário oficial), este
// painel lê `tentativas` (migração 003) e mostra QUALQUER partida
// completada por QUALQUER aluno, em qualquer modo — só visível pra admin,
// via RLS "tentativas_admin_le_todas" do lado do banco.
const NOMES_MODO_TENTATIVA = { diario: "Desafio diário", sistema: "Modo por sistemas", duelo: "Duelo 1v1" };
let estadoPainelProfessor = { busca: "", modo: "", tentativas: null, apelidoPorId: {} };

async function renderPainelProfessor() {
  if (!sessao.isAdmin) { renderIntro(); return; }
  estadoPainelProfessor = { busca: "", modo: "", tentativas: null, apelidoPorId: {} };
  limparApp();
  appEl.appendChild(renderMarca());
  appEl.appendChild(el("section", { class: "card" }, [
    el("h2", { text: "📊 Desempenho dos alunos" }),
    el("p", { text: "Toda partida completada por qualquer aluno logado, em qualquer modo (desafio diário, modo por sistemas, duelos)." }),
    el("button", { class: "btn fantasma", text: "⬅ Voltar à Administração", onclick: renderAdmin }),
  ]));

  const cardCarregando = el("section", { class: "card" }, [el("p", { text: "Carregando…" })]);
  appEl.appendChild(cardCarregando);

  const { data: tentativas, error } = await supabaseClient
    .from("tentativas")
    .select("*")
    .order("criado_em", { ascending: false })
    .limit(1000);

  if (error) {
    cardCarregando.replaceChildren(el("p", { class: "campo-erro", text:
      "Não foi possível carregar: " + error.message +
      (/relation .* does not exist/i.test(error.message) ? " (rode a migração 003 no SQL Editor do Supabase?)" : "") }));
    return;
  }

  const idsAlunos = [...new Set((tentativas || []).map((t) => t.user_id))];
  let apelidoPorId = {};
  if (idsAlunos.length > 0) {
    const { data: perfis } = await supabaseClient.from("perfis").select("id, apelido").in("id", idsAlunos);
    apelidoPorId = Object.fromEntries((perfis || []).map((p) => [p.id, p.apelido]));
  }

  estadoPainelProfessor.tentativas = tentativas || [];
  estadoPainelProfessor.apelidoPorId = apelidoPorId;
  cardCarregando.remove();
  renderizarTabelaPainelProfessor();
}

// Refaz só a parte de filtros+tabela, reaproveitando os dados já buscados
// (sem round-trip novo ao Supabase a cada tecla digitada na busca).
function renderizarTabelaPainelProfessor() {
  const foco = guardaFoco("painel-professor-busca");
  const existente = document.getElementById("painel-professor-conteudo");
  if (existente) existente.remove();

  const container = el("div", { id: "painel-professor-conteudo" });
  appEl.appendChild(container);

  const cardFiltros = el("section", { class: "card" });
  const campoBusca = document.createElement("input");
  campoBusca.type = "search"; campoBusca.className = "campo"; campoBusca.id = "painel-professor-busca";
  campoBusca.placeholder = "Buscar por apelido…";
  campoBusca.value = estadoPainelProfessor.busca;
  campoBusca.addEventListener("input", () => { estadoPainelProfessor.busca = campoBusca.value; renderizarTabelaPainelProfessor(); });
  cardFiltros.appendChild(el("h2", { text: "Filtrar" }));
  cardFiltros.appendChild(campoBusca);

  const filtroModo = document.createElement("select");
  filtroModo.className = "campo"; filtroModo.style.marginTop = "10px";
  filtroModo.appendChild(new Option("Todos os modos", ""));
  Object.entries(NOMES_MODO_TENTATIVA).forEach(([id, label]) => filtroModo.appendChild(new Option(label, id)));
  filtroModo.value = estadoPainelProfessor.modo;
  filtroModo.addEventListener("change", () => { estadoPainelProfessor.modo = filtroModo.value; renderizarTabelaPainelProfessor(); });
  cardFiltros.appendChild(filtroModo);
  container.appendChild(cardFiltros);

  const { tentativas, apelidoPorId, busca, modo } = estadoPainelProfessor;
  const termo = busca.trim().toLowerCase();
  const filtradas = tentativas.filter((t) => {
    if (modo && t.modo !== modo) return false;
    if (termo && !(apelidoPorId[t.user_id] || "").toLowerCase().includes(termo)) return false;
    return true;
  });

  const cardTabela = el("section", { class: "card" }, [el("h2", { text: `Tentativas (${filtradas.length})` })]);
  if (filtradas.length === 0) {
    cardTabela.appendChild(el("p", { text: "Nenhuma tentativa encontrada com esse filtro." }));
  } else {
    const tabela = document.createElement("table");
    tabela.className = "tabela-ranking";
    tabela.appendChild(el("thead", {}, [el("tr", {}, [
      el("th", { text: "Aluno" }), el("th", { text: "Modo" }), el("th", { text: "Detalhe" }),
      el("th", { text: "Pontuação" }), el("th", { text: "Eficiência" }), el("th", { text: "Quando" }),
    ])]));
    const corpo = document.createElement("tbody");
    filtradas.forEach((t) => {
      corpo.appendChild(el("tr", {}, [
        el("td", { text: apelidoPorId[t.user_id] || t.user_id.slice(0, 8) }),
        el("td", { text: NOMES_MODO_TENTATIVA[t.modo] || t.modo }),
        el("td", { text: t.modo === "sistema" ? (CATALOGO_SISTEMAS[t.modo_detalhe] || t.modo_detalhe || "") : (t.modo_detalhe || "") }),
        el("td", { text: `${t.total_score} / ${t.optimal_score}` }),
        el("td", { text: `${Math.round(t.efficiency)}%` }),
        el("td", { text: new Date(t.criado_em).toLocaleString("pt-BR") }),
      ]));
    });
    tabela.appendChild(corpo);
    const wrapper = document.createElement("div");
    wrapper.style.overflowX = "auto";
    wrapper.appendChild(tabela);
    cardTabela.appendChild(wrapper);
  }
  container.appendChild(cardTabela);

  restauraFoco(foco);
}


/* =========================================================================
 * 13. DUELO 1V1 (assíncrono)
 * -------------------------------------------------------------------------
 * Um aluno cria um duelo (sorteia 9 doenças de todo o banco + 9 categorias,
 * igual ao Modo por Sistemas, mas sem restringir a um sistema só), gera um
 * código curto e joga na hora. O adversário entra com o código quando
 * quiser (não precisa ser ao mesmo tempo) e joga o MESMO desafio salvo. Ao
 * final dos dois terem jogado, qualquer um vê o comparativo lado a lado.
 * Nunca entra no ranking oficial nem precisa dos dois online juntos.
 * ======================================================================= */

function gerarCodigoDuelo() {
  const alfabeto = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // sem 0/O, 1/I/L (evita confusão ao digitar)
  let codigo = "";
  for (let i = 0; i < 6; i++) codigo += alfabeto[Math.floor(Math.random() * alfabeto.length)];
  return codigo;
}

// Sorteia 9 doenças de TODO o banco (não só de um sistema) + 9 categorias
// escolhidas pela mesma busca gulosa do Modo por Sistemas (seção 11) — o
// seed é só pra reaproveitar embaralharComSeed, não precisa ser
// reproduzível depois (o desafio gerado fica salvo em `duelos.desafio`).
function gerarDesafioDuelo() {
  const seed = "duelo|" + Date.now() + "|" + Math.random();
  const doencaIds = embaralharComSeed(BANCO_DOENCAS.map((d) => d.id), seed).slice(0, 9);
  const parametrosSelecionados = escolherCategoriasAutomaticamente(doencaIds, 9);
  return { doencas_selecionadas: doencaIds, parametros_selecionados: parametrosSelecionados };
}

function construirDesafioDeDuelo(duelo) {
  return {
    id: "duelo-" + duelo.id,
    data: null,
    titulo: "Duelo 1v1",
    personalizado: true, // reaproveita a lógica "não entra no ranking oficial"
    doencas_selecionadas: duelo.desafio.doencas_selecionadas,
    parametros_selecionados: duelo.desafio.parametros_selecionados,
    explicacoes: {},
  };
}

async function criarDuelo() {
  if (!sessao.usuario) { renderLogin(); return; }
  const conteudo = gerarDesafioDuelo();
  const codigo = gerarCodigoDuelo();

  const { data, error } = await supabaseClient
    .from("duelos")
    .insert({ codigo, criador_id: sessao.usuario.id, desafio: conteudo })
    .select()
    .single();

  if (error) {
    window.alert("Não foi possível criar o duelo: " + error.message);
    return;
  }

  iniciarPartida(construirDesafioDeDuelo(data), { pratica: true });
  estado.duelo = { id: data.id, codigo: data.codigo, papel: "criador" };
  renderDoencaAtual();
}

async function entrarDuelo(codigoDigitado) {
  if (!sessao.usuario) { renderLogin(); return { erro: null }; }
  const codigo = codigoDigitado.trim().toUpperCase();
  if (!codigo) return { erro: "Digite um código." };

  const { data: duelo, error } = await supabaseClient.from("duelos").select("*").eq("codigo", codigo).maybeSingle();
  if (error) return { erro: "Erro ao buscar o duelo: " + error.message };
  if (!duelo) return { erro: "Duelo não encontrado — confira o código." };
  if (duelo.criador_id === sessao.usuario.id) return { erro: "Você criou esse duelo — espere um colega entrar com o código." };
  if (duelo.desafiante_id && duelo.desafiante_id !== sessao.usuario.id) return { erro: "Esse duelo já tem os dois jogadores." };

  if (duelo.status === "concluido") {
    renderResultadoDuelo(duelo.id);
    return { ok: true };
  }

  if (!duelo.desafiante_id) {
    const { error: erroEntrar } = await supabaseClient
      .from("duelos").update({ desafiante_id: sessao.usuario.id }).eq("id", duelo.id).is("desafiante_id", null);
    if (erroEntrar) return { erro: "Não foi possível entrar no duelo: " + erroEntrar.message };
  }

  iniciarPartida(construirDesafioDeDuelo(duelo), { pratica: true });
  estado.duelo = { id: duelo.id, codigo: duelo.codigo, papel: "desafiante" };
  renderDoencaAtual();
  return { ok: true };
}

function continuarDuelo(duelo) {
  iniciarPartida(construirDesafioDeDuelo(duelo), { pratica: true });
  estado.duelo = { id: duelo.id, codigo: duelo.codigo, papel: "desafiante" };
  renderDoencaAtual();
}

// Chamado por renderResultado() (seção 8) quando estado.duelo existe, no
// lugar do fluxo normal de resultado.
async function finalizarDuelo(resultado) {
  const { id, papel } = estado.duelo;
  const campos = papel === "criador"
    ? { criador_score: resultado.totalScore, criador_optimal: resultado.optimalScore, criador_alocacoes: estado.alocacoes }
    : { desafiante_score: resultado.totalScore, desafiante_optimal: resultado.optimalScore, desafiante_alocacoes: estado.alocacoes, status: "concluido" };

  const { error } = await supabaseClient.from("duelos").update(campos).eq("id", id);
  if (error) console.warn("[PatoVetZee] Não foi possível salvar o resultado do duelo:", error.message);

  salvarTentativa(resultado, "duelo", estado.duelo.codigo);

  if (papel === "criador") renderTelaDueloCriado(estado.duelo.codigo);
  else renderResultadoDuelo(id);
}

function renderTelaDueloCriado(codigo) {
  limparApp();
  appEl.appendChild(renderMarca());
  appEl.appendChild(el("section", { class: "card", style: "text-align:center" }, [
    el("h2", { text: "Duelo criado! 🎉" }),
    el("p", { text: "Sua partida foi registrada. Compartilhe este código com seu adversário:" }),
    el("div", { class: "codigo-duelo", text: codigo }),
    el("p", { text: "Assim que ele(a) jogar (na hora que quiser, não precisa ser agora), o comparativo aparece na lista de duelos." }),
    el("button", { class: "btn", text: "Ver meus duelos", onclick: renderDuelos }),
    el("button", { class: "btn fantasma", text: "⬅ Início", onclick: renderIntro }),
  ]));
}

async function renderResultadoDuelo(dueloId) {
  limparApp();
  appEl.appendChild(renderMarca());
  const cardCarregando = el("section", { class: "card" }, [el("p", { text: "Carregando duelo…" })]);
  appEl.appendChild(cardCarregando);

  const { data: duelo, error } = await supabaseClient.from("duelos").select("*").eq("id", dueloId).maybeSingle();
  if (error || !duelo) {
    cardCarregando.replaceChildren(
      el("p", { text: "Duelo não encontrado." }),
      el("button", { class: "btn secundario", text: "⬅ Voltar", onclick: renderDuelos })
    );
    return;
  }

  const idsRelevantes = [duelo.criador_id, duelo.desafiante_id].filter(Boolean);
  const { data: perfis } = await supabaseClient.from("perfis").select("id, apelido").in("id", idsRelevantes);
  const apelidoPorId = Object.fromEntries((perfis || []).map((p) => [p.id, p.apelido]));

  cardCarregando.remove();

  if (duelo.status !== "concluido") {
    appEl.appendChild(el("section", { class: "card", style: "text-align:center" }, [
      el("h2", { text: "Aguardando o adversário" }),
      el("p", { text: `Código: ${duelo.codigo}` }),
      el("p", { text: "Assim que a outra pessoa jogar, o comparativo aparece aqui." }),
      el("button", { class: "btn secundario", text: "⬅ Meus duelos", onclick: renderDuelos }),
    ]));
    return;
  }

  const criadorNome = apelidoPorId[duelo.criador_id] || "Jogador 1";
  const desafianteNome = apelidoPorId[duelo.desafiante_id] || "Jogador 2";
  const vencedor = duelo.criador_score === duelo.desafiante_score ? "empate"
    : duelo.criador_score > duelo.desafiante_score ? "criador" : "desafiante";

  appEl.appendChild(el("section", { class: "card" }, [
    el("h2", { text: "Resultado do duelo" }),
    el("div", { class: "comparativo-duelo" }, [
      el("div", { class: "lado-duelo" + (vencedor === "criador" ? " vencedor" : "") }, [
        el("strong", { text: criadorNome }),
        el("div", { class: "placar-duelo", text: `${duelo.criador_score} / ${duelo.criador_optimal}` }),
      ]),
      el("div", { class: "versus-duelo", text: "×" }),
      el("div", { class: "lado-duelo" + (vencedor === "desafiante" ? " vencedor" : "") }, [
        el("strong", { text: desafianteNome }),
        el("div", { class: "placar-duelo", text: `${duelo.desafiante_score} / ${duelo.desafiante_optimal}` }),
      ]),
    ]),
    el("p", { style: "text-align:center; font-weight:800; margin-top:14px;", text:
      vencedor === "empate" ? "Empate! 🤝" : `${vencedor === "criador" ? criadorNome : desafianteNome} venceu esse duelo! 🏆` }),
  ]));

  appEl.appendChild(el("section", { class: "card", style: "text-align:center" }, [
    el("button", { class: "btn secundario", text: "⬅ Meus duelos", onclick: renderDuelos }),
  ]));
}

async function renderDuelos() {
  if (!sessao.usuario) { renderLogin(); return; }
  limparApp();
  appEl.appendChild(renderMarca());

  appEl.appendChild(el("section", { class: "card" }, [
    el("h2", { text: "⚔️ Duelo 1v1" }),
    el("p", { text: "Desafie um colega: os dois jogam o MESMO conjunto de 9 doenças (em momentos diferentes, sem pressa) e comparam quem pontuou mais. Não conta pro ranking oficial." }),
    el("button", { class: "btn", text: "+ Criar novo duelo", onclick: criarDuelo }),
  ]));

  const campoCodigo = document.createElement("input");
  campoCodigo.type = "text"; campoCodigo.className = "campo"; campoCodigo.maxLength = 8;
  campoCodigo.placeholder = "Código do duelo (ex.: 7F3K9A)";
  const erroEntrar = el("p", { class: "campo-erro" });

  appEl.appendChild(el("section", { class: "card" }, [
    el("h2", { text: "Entrar com um código" }),
    campoCodigo,
    erroEntrar,
    el("button", { class: "btn secundario", text: "Entrar no duelo", onclick: async () => {
      erroEntrar.textContent = "";
      const resultado = await entrarDuelo(campoCodigo.value);
      if (resultado && resultado.erro) erroEntrar.textContent = resultado.erro;
    }}),
  ]));

  const cardLista = el("section", { class: "card" }, [el("h2", { text: "Meus duelos" }), el("p", { text: "Carregando…" })]);
  appEl.appendChild(cardLista);

  appEl.appendChild(el("section", { class: "card", style: "text-align:center" }, [
    el("button", { class: "btn fantasma", text: "⬅ Início", onclick: renderIntro }),
  ]));

  const { data: meusDuelos, error } = await supabaseClient
    .from("duelos")
    .select("*")
    .or(`criador_id.eq.${sessao.usuario.id},desafiante_id.eq.${sessao.usuario.id}`)
    .order("criado_em", { ascending: false });

  cardLista.replaceChildren(el("h2", { text: "Meus duelos" }));

  if (error) {
    cardLista.appendChild(el("p", { class: "campo-erro", text: "Não foi possível carregar seus duelos: " + error.message +
      (/relation .* does not exist/i.test(error.message) ? " (rode a migração 003?)" : "") }));
    return;
  }
  if (!meusDuelos || meusDuelos.length === 0) {
    cardLista.appendChild(el("p", { text: "Você ainda não tem duelos. Crie um acima!" }));
    return;
  }

  const idsRelevantes = [...new Set(meusDuelos.flatMap((d) => [d.criador_id, d.desafiante_id]).filter(Boolean))];
  const { data: perfis } = await supabaseClient.from("perfis").select("id, apelido").in("id", idsRelevantes);
  const apelidoPorId = Object.fromEntries((perfis || []).map((p) => [p.id, p.apelido]));

  meusDuelos.forEach((d) => {
    const souCriador = d.criador_id === sessao.usuario.id;
    const nomeOponente = souCriador ? apelidoPorId[d.desafiante_id] : apelidoPorId[d.criador_id];
    const statusTexto = d.status === "concluido" ? "Concluído"
      : souCriador ? "Aguardando oponente" : "Você ainda não jogou";

    let botaoAcao;
    if (d.status === "concluido") {
      botaoAcao = el("button", { class: "btn secundario btn-pequeno", text: "Ver resultado", onclick: () => renderResultadoDuelo(d.id) });
    } else if (!souCriador && d.desafiante_score == null) {
      botaoAcao = el("button", { class: "btn btn-pequeno", text: "Jogar agora", onclick: () => continuarDuelo(d) });
    } else {
      botaoAcao = el("span", { class: "linha-admin-meta", text: "—" });
    }

    cardLista.appendChild(el("div", { class: "linha-admin-doenca" }, [
      el("div", { class: "linha-admin-info" }, [
        el("strong", { text: `Código ${d.codigo}` }),
        el("span", { class: "linha-admin-meta", text: `${nomeOponente ? "vs. " + nomeOponente : "aguardando oponente"} · ${statusTexto}` }),
      ]),
      el("div", { class: "linha-admin-acoes" }, [botaoAcao]),
    ]));
  });
}


/* =========================================================================
 * INICIALIZAÇÃO
 * ======================================================================= */

async function init() {
  if (DEBUG) {
    console.log("[PatoVetZee] Modo debug ativo (?debug=1).");
    rodarTestesInternosHungaro();
  }
  // Checagem de integridade do banco roda sempre (é barata e evita passar
  // um desafio quebrado pra turma por causa de um campo esquecido/errado).
  validarBancoDoencas();

  // Renderiza a tela inicial já, sem esperar nada assíncrono — evita tela em
  // branco. Categorias extras carregam ANTES do banco de doenças (que
  // valida as doenças contra CATALOGO_PARAMETROS — precisa estar completo
  // primeiro); sessão e banco remoto podem rodar em paralelo com isso.
  renderIntro();
  await carregarCategoriasRemoto();
  const [, bancoTrocou] = await Promise.all([verificarSessaoAtual(), carregarBancoRemoto()]);
  if (sessao.usuario || bancoTrocou) renderIntro();
}

init();
